name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Lane 1 - the cheap gates. Nothing else runs until these are clean.
  gates:
    name: format, lints and banned patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: banned patterns (R1 and determinism)
        run: bash scripts/check-banned.sh

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: frozen contracts
        run: cargo run --package xtask -- contracts --check

      # Article VI rule M1: no model card, no model. The same check refuses an
      # unsigned manifest and a file whose digest moved.
      - name: signed models and model cards
        run: cargo run --package xtask -- models

  # Lane 2 - the test matrix. Windows first: it is where photographers are.
  test:
    name: tests on ${{ matrix.os }}
    needs: gates
    runs-on: ${{ matrix.os }}
    # Every timing budget in `perf/budgets.toml` and phase 14's proxy guardrail are measured
    # on a development machine. A shared GitHub runner is two and a half to five times slower
    # than that - measured: 497 ms on macOS, 669 ms and 1,123 ms on ubuntu, against a 210 ms
    # development figure - so the budgets are relaxed by a named factor here rather than being
    # loosened in the file, which would remove the guardrail from the machine anybody
    # develops on. Sizes, counts and costs are NOT scaled: a byte is a byte on any host.
    env:
      AURA_PERF_HOST_SCALE: "4"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: phase 01 verify on the reference fixtures
        run: cargo run --release --package aura-cli -- verify --work target/phase01-verify

      - name: phase 02 verify - previews, cache and colour on the RAW fixtures
        run: cargo run --release --package aura-cli -- verify --phase 02 --work target/phase02-verify

      - name: phase 03 verify - runtime, integrity, memory, cancellation, rollback
        run: cargo run --release --package aura-cli -- verify --phase 03 --work target/phase03-verify

      # Acceptance criterion 7 of phase 04: CI contains no network access and
      # still fully tests the gateway. Every provider response in this run comes
      # from a cassette in tests/cloud/cassettes.
      - name: phase 04 verify - cloud gateway, keys, payload, cache, budget, offline
        run: cargo run --release --package aura-cli -- verify --phase 04 --work target/phase04-verify

      # Two cards of RAW fixtures, a resumable embedding pass, the index, a
      # five-millisecond query, a time window, a camera filter, the snapshot and
      # its refusals, an incremental second card, and determinism. No network of
      # any kind is involved: nothing in phase 05 can open a socket.
      - name: phase 05 verify - embeddings, descriptors, index, snapshot, incremental
        run: cargo run --release --package aura-cli -- verify --phase 05 --work target/phase05-verify

      # PHASE-14. The develop engine. No network, no GPU and no model: the gate is
      # arithmetic over authored pixels, so it runs anywhere the workspace builds.
      # It prints what it does not prove - see docs/progress/PHASE-14-EXIT.md
      # conditions C1 and C2 - and exits non-zero on a real failure.
      - name: phase 14 verify - recipe, colour, tiling, parity, interchange
        run: cargo run --release --package aura-cli -- verify --phase 14 --work target/phase14-verify

      # PHASE-19. Local light sculpting. No network, no GPU, no model and - on this
      # build - no mask: phase 18's MaskService is not wired into LocalPass, so the
      # gate proves the arithmetic against fixtures and prints what it does not
      # prove at the end of every run.
      # See docs/progress/PHASE-19-EXIT.md conditions C1 to C3.
      - name: phase 19 verify - policy, lighting, pairing, shaping, shine, governor
        run: cargo run --release --package aura-cli -- verify --phase 19 --work target/phase19-verify

      # PHASE-23. Geometry. No network, no GPU and no model: the gate proves the
      # lens estimator, the straightening solve, the keystone cap, the crop safety
      # filter and the store against fixtures whose geometry was painted in, and
      # prints what it does not prove at the end of every run.
      # See docs/progress/PHASE-23-EXIT.md conditions C1 to C3.
      - name: phase 23 verify - lens, straighten, keystone, crop safety, variants
        run: cargo run --release --package aura-cli -- verify --phase 23 --work target/phase23-verify

      # The same gate from the Python side. There are no expert crop labels in this
      # repository, so this runs the whole computation against an authored answer.
      - name: crop agreement self-test
        run: python ml/eval/crop_agreement.py --self-test

  # Lane 3 - the UI. Type errors here are runtime crashes for a photographer.
  ui:
    name: ui type-check, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: install
        working-directory: ui
        run: npm ci || npm install

      - name: type-check
        working-directory: ui
        run: npm run lint

      - name: unit tests
        working-directory: ui
        run: npm test

      - name: build
        working-directory: ui
        run: npx vite build

  # Lane 4 - supply chain. Advisory and licence failures block the merge.
  supply-chain:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Lane 5 - budgets. A regression against perf/budgets.toml fails the build.
  budgets:
    name: benchmarks
    needs: gates
    runs-on: ubuntu-latest
    # Every timing budget in `perf/budgets.toml` and phase 14's proxy guardrail are measured
    # on a development machine. A shared GitHub runner is two and a half to five times slower
    # than that - measured: 497 ms on macOS, 669 ms and 1,123 ms on ubuntu, against a 210 ms
    # development figure - so the budgets are relaxed by a named factor here rather than being
    # loosened in the file, which would remove the guardrail from the machine anybody
    # develops on. Sizes, counts and costs are NOT scaled: a byte is a byte on any host.
    env:
      AURA_PERF_HOST_SCALE: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2

      - name: ingest benchmarks
        run: cargo bench --package aura-ingest --bench ingest_throughput -- --warm-up-time 1 --measurement-time 3

      - name: decode benchmarks
        run: cargo bench --package aura-preview --bench decode -- --warm-up-time 1 --measurement-time 3

      # Release, because a budget is a claim about the binary a photographer
      # runs. The cloud payload builder is a pixel loop and is more than an
      # order of magnitude slower unoptimised; asserting a debug number would
      # mean either a failing gate or a budget too loose to catch anything.
      # One thread, deliberately. Added in phase 05: three 4,000-vector index
      # builds sharing a runner's cores measure the harness rather than the code,
      # and a budget suite that races itself reports a different number every run.
      - name: budget assertions
        run: cargo test --release --package aura-perf --all-targets -- --test-threads=1

      # The evaluation gates from section 6.4 of phase 05. Release, because the
      # duplicate sweep is sixty photographs through a perceptual hash and the
      # graph recall check builds a thousand-vector index.
      - name: embedding evaluation gates
        run: cargo test --release --package aura-vision --test embedding_eval -- --nocapture

      # PHASE-14 section 10.1, as a test suite. Release, because the tiling identity
      # renders a 700x540 frame through every spatial stage twice.
      - name: develop evaluation gates
        run: cargo test --release --package aura-render --test render_eval -- --nocapture

      # PHASE-14 section 11. Four of its five rows are waived (no GPU backend,
      # ADR-0029 section 4); what is asserted is the processor path and the store.
      # `--test-threads=1` for the same reason the whole-suite step above uses it: these
      # cases each render a frame, and five of them racing across the runner's cores
      # measure the contention rather than the renderer. This step re-runs a suite that
      # has already passed serially, purely to print the figures, and it was the one
      # place the rule was missed - it read 737 ms per unit against 532 in parallel and
      # 286 serially on the same machine.
      - name: develop budgets
        run: cargo test --release --package aura-perf --test develop_budgets -- --test-threads=1 --nocapture

      # PHASE-19 section 10.1, as a test suite. Six of its seven gates are measured
      # here; the seventh is an expert study over four hundred frames and is
      # condition C3 rather than a number.
      - name: local light evaluation gates
        run: cargo test --release --package aura-brain-photo --test local_eval -- --nocapture

      # PHASE-19 section 11. The render row is waived twice over - no GPU backend
      # and no phase 18 matte reaching the pass - so what is asserted is the
      # processor path and the store.
      - name: local light budgets
        run: cargo test --release --package aura-perf --test local_budgets -- --test-threads=1 --nocapture

      # PHASE-20. The assembly proof: migration 21, the preset floor the code owns
      # rather than the file, the detector, the protect veto, the texture guard and
      # a tattoo that neither the service nor the database will delete.
      - name: phase 20 gate
        run: cargo run --release --package aura-cli -- verify --phase 20 --work target/phase20-verify

      - name: retouch evaluation gates
        run: cargo test --release --package aura-retouch --test retouch_eval -- --nocapture

      # PHASE-20 section 11. Two of its four rows are waived - no GPU backend and no
      # 45 MP frame in this repository - so what is asserted is the decision on the
      # processor path and the store.
      - name: retouch budgets
        run: cargo test --release --package aura-perf --test retouch_budgets -- --test-threads=1 --nocapture

      # PHASE-21. The assembly proof: migration 22 and its two triggers, the opt-in
      # matrix and the ceilings the code owns rather than the file, the four measured
      # detectors, the naturalness guard, and the borrow rule with its disclosure end
      # to end. This step and the two below it were never added when phase 21 shipped.
      - name: phase 21 gate
        run: cargo run --release --package aura-cli -- verify --phase 21 --work target/phase21-verify

      - name: micro-retouch evaluation gates
        run: cargo test --release --package aura-retouch --test micro_eval -- --nocapture

      # PHASE-21 section 11. The render rows are waived for the same reason phase 20's
      # are; what is asserted is the decision on the processor path and the store.
      - name: micro-retouch budgets
        run: cargo test --release --package aura-perf --test micro_budgets -- --test-threads=1 --nocapture

      # PHASE-22. The assembly proof: migration 23 and its trigger, the scene profiles
      # and the twenty camera noise models, the evidence-driven tier ladder, the four
      # sharpening preconditions, the identity constraint end to end, and the self-check
      # with its two levers.
      - name: phase 22 gate
        run: cargo run --release --package aura-cli -- verify --phase 22 --work target/phase22-verify

      - name: restoration evaluation gates
        run: cargo test --release --package aura-restore --test restore_eval -- --nocapture

      # PHASE-22 has no budgets test. Its three rows in perf/budgets.toml -
      # restore_plan_frame, restore_identity_guard and restore_store_per_1000_images -
      # were written when the phase shipped and no `restore_budgets.rs` was written with
      # them, so nothing asserts them. Recorded as a gap rather than papered over with a
      # step that would fail on a missing target. PHASE-22-EXIT.md condition C8.

      # Two independent implementations of the metrics have to agree, or neither
      # is trustworthy. The Python half also self-tests without cargo.
      - name: python evaluation self-tests
        run: |
          python ml/models/embed/dataset.py --self-test
          python ml/models/embed/train_contrastive.py --dry-run
          python ml/models/embed/eval_retrieval.py --self-test
          python ml/models/embed/export.py --placeholder --verify models
          python ml/models/local/train_light_targets.py --self-test
          python ml/models/local/eval_local.py --self-test
          python ml/models/retouch/train_blemish.py --self-test
          python ml/models/retouch/train_permanent.py --self-test
          python ml/models/retouch/eval_retouch.py --self-test
          python ml/models/retouch/export.py --verify models
          python ml/models/micro/train_flyaway.py --self-test
          python ml/models/micro/train_glare.py --self-test
          python ml/models/micro/train_lint.py --self-test
          python ml/models/micro/eval_micro.py --self-test
          python ml/models/micro/export.py --verify models
          python ml/models/restore/train_denoise.py --self-test
          python ml/models/restore/train_face_recovery.py --self-test
          python ml/models/restore/eval_restore.py --self-test
          python ml/models/restore/export.py --verify models
