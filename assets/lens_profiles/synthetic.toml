# SYNTHETIC lens profiles. Every row here was fabricated - see README.md.
#
# The coefficients have the right sign and order of magnitude for the focal length: a wide
# zoom at its short end barrels, the same zoom at its long end pincushions slightly, a fast
# standard prime barrels a little and vignettes a lot wide open, and lateral chromatic
# aberration is a few parts in ten thousand and larger at the wide end. They are not
# measurements of any lens.

[table]
version     = 1
attribution = "Fabricated for the AURA test suite. No lens was measured to produce this file."

