[advisories]
version = 2
yanked  = "deny"
ignore  = []

[licenses]
version = 2
allow   = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards         = "deny"
deny = [
  { name = "openssl", reason = "use rustls; no system OpenSSL dependency in a desktop app" },
  { name = "chrono", reason = "use time; chrono's tz handling has repeatedly broken determinism" },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
