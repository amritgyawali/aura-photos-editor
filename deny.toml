[advisories]
version = 2
yanked  = "deny"
# Every entry below arrives through `rustls-rustcrypto` 0.0.2-alpha, the pure-Rust
# crypto provider ADR-0066 chose because the reference build machine has no C
# toolchain. It is the newest release and pins `rustls-webpki` ^0.102, so there is
# no upgrade that clears these. Each is scoped to one advisory id with the reason
# it does not reach this build; a new advisory against any of these crates still
# fails the gate. Remove an entry the day the provider stops pulling the crate in.
ignore  = [
  # rustls-webpki 0.102 is used by the provider for algorithm-identifier constants
  # (`webpki::alg_id`) and nothing else. Certificate path building, CRL parsing and
  # name-constraint checks run in rustls's own rustls-webpki 0.103, which is
  # patched. The four advisories below are in code 0.102 never executes here.
  { id = "RUSTSEC-2026-0049", reason = "webpki 0.102 CRL matching; CRLs are verified by webpki 0.103 in rustls" },
  { id = "RUSTSEC-2026-0098", reason = "webpki 0.102 URI name constraints; path validation is webpki 0.103 in rustls" },
  { id = "RUSTSEC-2026-0099", reason = "webpki 0.102 wildcard name constraints; path validation is webpki 0.103 in rustls" },
  { id = "RUSTSEC-2026-0104", reason = "webpki 0.102 CRL parsing panic; this build parses no CRL with 0.102" },
  # Marvin is a timing leak of an RSA *private* key during decryption or signing.
  # aura-cloud is a TLS client built `with_no_client_auth`, so it only verifies
  # server signatures with public keys and never performs a private-key operation.
  { id = "RUSTSEC-2023-0071", reason = "rsa Marvin attack needs a private-key operation; the TLS client only verifies" },
  # `paste` is a compile-time macro crate with no runtime code; unmaintained, not vulnerable.
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained build-time macro code, pulled in by rustls-rustcrypto" },
]

[licenses]
version = 2
allow   = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
]
confidence-threshold = 0.9

# One crate, one licence, one reason. `jpeg-encoder` is "(MIT OR Apache-2.0) AND
# IJG": the MIT half is already allowed, and the IJG half is the Independent JPEG
# Group licence that every JPEG encoder derived from libjpeg carries. It is
# FSF-free and permissive; its one obligation is the acknowledgement recorded in
# THIRD-PARTY-NOTICES.md. Scoped to this crate so a second IJG dependency still
# fails the gate.
exceptions = [
  { crate = "jpeg-encoder", allow = ["IJG"] },
  # `webpki-roots` is the Mozilla trusted-root certificate set, and it is *data*
  # rather than code - which is why it carries the Community Data License
  # Agreement rather than a software licence. CDLA-Permissive-2.0 imposes no
  # conditions on use or redistribution and no attribution requirement; the OSI
  # has not reviewed it because it is not a software licence. Scoped to this
  # crate so a second CDLA dependency still fails the gate. See
  # docs/adr/ADR-0066-tls-and-the-provider-catalogue.md section 4.
  { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

# The workspace crates are `publish = false` and carry the non-SPDX marker
# "UNLICENSED", so they have no expression to check. Third-party code is
# unaffected: this ignores private crates only.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards         = "deny"
# A sibling crate is depended on by path and has no version requirement, which is
# a wildcard by definition. Allowed for private crates only, so a third-party
# wildcard is still a failure.
allow-wildcard-paths = true
deny = [
  { name = "openssl", reason = "use rustls; no system OpenSSL dependency in a desktop app" },
  { name = "chrono", reason = "use time; chrono's tz handling has repeatedly broken determinism" },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
