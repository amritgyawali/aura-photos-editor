max_ms_per_unit = 300

# Section 11 sets no storage row for this phase. One is measured anyway, and it is the first
# figure since phase 09 that is **above** the kilobyte per image the earlier phases aimed at.
#
# The measured decomposition on 1,000 photographs of the widest frame the fixtures produce - a
# flyaway calmed, four marks off a lapel, teeth and eyes corrected, seven reason codes - taken as
# `dbstat` payload rather than `PRAGMA page_count`, which quantises to 4 KiB:
