[size.peak_rss_batch_proxy]
max_bytes = 2684354560  # 2.5 GB

# Phase 03 performance budgets, from PHASE-03 section 11.
#
# The two GPU throughput rows in that section - 220 img/s on an RTX 4070 and
# 110 img/s on an M3 Pro - are not here, because this build has no GPU backend
# and a budget nothing can measure is a wish. They are waived with their reasons
# in docs/adr/ADR-0007-inference-runtime.md and the waiver expires when a GPU
# backend lands.

# One model, parsed, compiled and its weights rounded, with nothing cached.
[stage.cold_model_load]
max_elapsed_ms = 900

# The scheduler's own cost, measured over 1,000 admissions so a 0.4 ms budget is
# expressible in whole milliseconds.
[stage.infer_admission_1000]
max_elapsed_ms  = 400
max_ms_per_unit = 1

# The processor path with a quantised model: section 11 asks for 18 images per
# second, which is 55 ms per image.
[stage.infer_embedding_cpu_int8]
max_elapsed_ms  = 3000
max_ms_per_unit = 55

# Enumerate the providers, run the reference model twenty times on each, decide.
[stage.hardware_probe]
max_elapsed_ms = 15000

# Loading the models a project open needs before the photographer sees anything.
[stage.warmup_startup_models]
max_elapsed_ms = 2500

# Phase 04 performance budgets, from PHASE-04 section 11.
#
# Provider latency is deliberately absent: it is somebody else's service and
# cannot be a budget we assert. What is asserted is the gateway's own cost, the
# call count, the price, and how much of a wedding a total cloud outage costs.

# The gateway's own work per call, excluding the provider: policy, payload
# inspection, cache lookup, cost estimate, audit row. Measured on the cache path,
# which is that work with no network in it.
[stage.cloud_gateway_overhead]
max_elapsed_ms  = 15
max_ms_per_unit = 15

# Building the thing that is actually uploaded: twelve 384 px tiles, laid out
# into a 1536 x 864 sheet and JPEG encoded.
#
# Measured, not guessed: 167 ms in release on the development machine, so the
# budget is 250 ms - enough headroom for a slower laptop, tight enough that a
# two-times regression fails. At one sheet per 40 images this is about 12 s
# across a 3,000 image wedding, and it is off the critical path.
[stage.cloud_contact_sheet_build]
max_elapsed_ms = 250

# Calls for a 3,000 image wedding at the default one-per-40-images policy.
[count.cloud_calls_per_3000_images]
max_count = 75

# Cost for that wedding at default settings, in hundredths of a US cent so the
# budget file stays integer-only.
[cost.cloud_per_3000_images]
max_usd_hundredths_of_a_cent = 15000  # USD 1.50

# What a total cloud outage costs the wall clock of a full run, as a percentage.
# Cloud work never blocks a pipeline stage, so the only cost is bounded retries.
[count.cloud_outage_overhead_percent]
max_count = 3

# The size of the thing that leaves the machine. Not a speed budget - a privacy
# one, asserted in the same place so it cannot be raised quietly.
[size.cloud_payload]
max_bytes = 4194304  # 4 MB

# Phase 05 performance budgets, from PHASE-05 section 11.
#
# Two of the five rows in that section are absent, and their absence is recorded
# rather than quietly filled in: "4,000 embeddings on an RTX 4070 in <= 150 s" and
# "on an M3 Pro in <= 300 s" both describe hardware this build cannot reach,
# because there is no GPU backend (ADR-0007). They are waived with an expiry
# condition in docs/adr/ADR-0011-embeddings-and-similarity-index.md section 5.
#
# What replaces them is the row below it: the same work on the processor path,
# measured on the development machine, so a regression in the embedding pass has
# something real to fail against.

# Building the graph for a 4,000-image wedding from scratch.
#
# Section 11 asks for 400 ms and this build does not meet it. The row is kept, with
# the measured figure and headroom, rather than deleted: 2.7 s in release on the
# development machine, so a two-times regression fails.
#
# Why it is over: ef_construction = 200 with 64 neighbours at layer zero is roughly
# 30 GFLOP of 512-wide dot products, computed in safe scalar Rust on four cores.
# Closing the gap needs SIMD intrinsics and therefore `unsafe`, which the workspace
# forbids. Waived by PERF and CTO in
# docs/adr/ADR-0011-embeddings-and-similarity-index.md section 5, with an expiry.
#
# What acceptance criterion 4 actually asks for - "re-opening a project rebuilds or
# loads the index in under 400 ms" - is met by the snapshot row below, at 25 ms.
[stage.index_cold_build_4000]
max_elapsed_ms = 5500

# One k-nearest-neighbour query at k = 32, measured over 200 queries so a 5 ms
# budget is expressible in whole milliseconds.
[stage.index_knn_200_queries]
max_elapsed_ms  = 1000
max_ms_per_unit = 5

# A time-windowed query. Section 10.1 asks for under 1 ms, which is why the
# window is a pre-filter over a sorted timeline rather than a post-filter.
[stage.index_windowed_200_queries]
max_elapsed_ms  = 200
max_ms_per_unit = 1

# Loading a persisted snapshot instead of rebuilding. The reason a second open is
# instant, and the other half of acceptance criterion 4.
[stage.index_snapshot_load_4000]
max_elapsed_ms = 400

# The embedding pass on the processor path, per image, including the model, the
# four descriptors and the difference hash but not the preview decode.
#
# Measured, not guessed: 69 ms per image in release on the development machine
# (Intel i5-10300H, fp32, one frame at a time, a tier 1 thumbnail in and a row
# out). The budget is 110 ms, which leaves room for a slower laptop and fails on a
# two-times regression. This row is what stands in for the two waived GPU
# throughput rows, and 69 ms is 4.6 minutes for a 4,000-image wedding.
[stage.embed_image_cpu]
max_elapsed_ms  = 12000
max_ms_per_unit = 110

# Section 11: storage per image, vector plus descriptors. 1.6 KB, where a
# kilobyte is 1,024 bytes. The shipped payload is 1,623 bytes and the margin is
# fifteen: a future column is a budget conversation, not a quiet addition.
[size.embedding_per_image]
max_bytes = 1638

# The in-memory ceiling from section 12, as a count rather than a hope. Past it,
# AURA-ML-5016 is raised and queries fall back to the exact flat scan.
[count.index_in_memory_ceiling]
max_count = 20000

# Phase 06 performance budgets, from PHASE-06 section 11.
#
# Two of the five rows in that section are absent, and their absence is recorded
# rather than quietly filled in: "the face pipeline over 4,000 images in <= 240 s
# on an RTX 4070" and "<= 480 s on an M3 Pro" both describe hardware this build
# cannot reach, because there is no GPU backend (ADR-0007). They are waived with
# an expiry condition in
# docs/adr/ADR-0013-people-intelligence-and-the-biometric-store.md section 6.
#
# What replaces them is the per-image row below, measured on the processor path,
# so a regression in the face pass has something real to fail against.

# One frame, end to end on the processor path: the 640 px detector pass, the
# anchor decode, the suppression, one aligned warp per face, the quality
# measurements, the quality head and the recogniser - but not the proxy decode,
# which phase 02 already budgets.
#
# Measured, not guessed: 148 ms for the detector pass plus 12.9 ms per face for
# the recogniser and the head, which at the fixture set's 2.4 faces per frame is
# about 180 ms. The budget is 420 ms, which leaves room for a slower laptop and
# for the occasional tiled frame in a sample, and fails on a two-times
# regression.
#
# At 180 ms a 4,000-image wedding is twelve minutes without tiling. That is the
# number the waived GPU rows would have replaced, and it is in the exit report.
[stage.face_scan_image_cpu]
max_elapsed_ms  = 12000
max_ms_per_unit = 420

# Clustering, section 11: 25,000 faces in 12 s. The quadratic part is capped at
# MAX_SKELETON (4,096) by construction, so this is asserted at the cap rather
# than at 25,000 - past the cap the work is linear and the cap is what the budget
# actually constrains.
[stage.identity_cluster_skeleton]
max_elapsed_ms = 12000

# The People panel's first paint: the coverage view, the identity summary and one
# sealed crop per card. Section 11 asks for 300 ms.
[stage.people_panel_open]
max_elapsed_ms = 300

# Section 11: face store size per 1,000 images. 25 MB, where a megabyte is
# 1,048,576 bytes. At the fixture set's 2.4 faces per frame that is 2,400 faces,
# so the per-face payload has about 10 KB to work with - which the 1,239-byte
# catalog row and the sealed 112 px crop fit inside with room to spare.
[size.face_store_per_1000_images]
max_bytes = 26214400  # 25 MB

# The tiled pass costs five detector passes instead of one, and section 12 names
# "tiled detection doubles cost" as a failure mode to measure rather than assume.
# This is the ceiling on how often it may fire across a wedding, as a percentage.
[count.tiled_frame_percent]
max_count = 25

# ---------------------------------------------------------------------------
# Phase 07 performance budgets, from PHASE-07 section 11.
#
# All four rows are here, and none is waived. That is unusual for this project
# and it has one cause: the scene heads sit on the frozen phase 05 embedding
# rather than on pixels, so nothing in this phase needs a GPU to be measured
# honestly. Section 6.1's "scene inference costs almost nothing extra per image"
# is the design claim, and these are the numbers that hold it to it.
# ---------------------------------------------------------------------------

# Scene plus attributes for 4,000 images, reusing embeddings. Section 11: 35 s.
#
# Asserted per unit rather than in total, so the test can measure a few hundred
# frames instead of four thousand and still fail on a regression.
#
# 35 s over 4,000 frames is 8.75 ms each. The budget schema takes whole
# milliseconds, so the number here is 8 - the floor rather than the ceiling,
# which makes this budget slightly STRICTER than section 11 rather than looser.
# That is the correct direction to round a budget in, and it costs nothing: the
# measured per-frame cost is dominated by reading the embedding out of SQLite
# rather than by the two Gemms, and is well under either figure.
[stage.scene_classify_image]
max_elapsed_ms  = 35000
max_ms_per_unit = 8

# Segmentation and smoothing over a whole wedding. Section 11: 2 s.
#
# This is the Viterbi pass over nine states, the fused signal, up to eighteen
# PELT runs during the penalty search, the merge pass and the medoid per chapter.
# Measured on the 1,692-frame Hindu fixture; a 4,000-frame wedding is linear in
# the first three and quadratic only inside a chapter, which is a few hundred
# frames.
[stage.story_segment_project]
max_elapsed_ms = 2000

# The timeline's first paint. Section 11: 200 ms.
#
# One indexed read of `segments` and one of `v_scene_coverage`. A wedding has at
# most twenty chapters by construction (changepoint::CHAPTER_BAND), so this is a
# read of a bounded list rather than of a project.
[stage.story_timeline_open]
max_elapsed_ms = 200

# Section 11: extra storage per image, 400 bytes.
#
# The `image_scenes` row is 118 bytes of fixed columns plus a top-3 JSON array of
# at most 132, and the `segment_images` row is 76. Asserted per 1,000 images so
# the number in the file is readable: 400 x 1,000 = 400,000.
[size.scene_store_per_1000_images]
max_bytes = 400000

# ---------------------------------------------------------------------------
# Phase 08 performance budgets, from PHASE-08 section 11.
#
# All four rows are here and none is waived, for phase 07's reason one phase
# on: grouping reads `embeddings`, `descriptors`, `photo`, `faces` and
# `image_scenes` and opens no image file, so nothing in this phase needs a GPU
# to be measured honestly. Section 6.2's "never all-pairs" is the design claim,
# and these are the numbers that hold it to it.
# ---------------------------------------------------------------------------

# Grouping 4,000 images. Section 11: 6 s.
#
# Asserted per unit as well as in total, so the test can measure a few thousand
# frames instead of four and still fail on a regression. 6 s over 4,000 frames
# is 1.5 ms each; the schema takes whole milliseconds, so the number here is 1 -
# the floor rather than the ceiling, which makes this budget STRICTER than
# section 11 rather than looser. That is the correct direction to round in, and
# it costs nothing: the measured per-frame cost is dominated by reading a
# 1,024-byte vector out of SQLite rather than by the candidate sweep.
[stage.moments_group_image]
max_elapsed_ms  = 6000
max_ms_per_unit = 1

# Grouping 12,000 images. Section 11: 25 s.
#
# A separate row rather than a scaling of the first, because the phase document
# states both and because the interesting claim is that the second is roughly
# three times the first rather than nine times it. The candidate sweep is
# bounded by `graph::MAX_NEIGHBOURS` per frame, so the whole pass is linear-ish
# in the frame count; a quadratic regression shows up here and nowhere else.
[stage.moments_group_large_project]
max_elapsed_ms = 25000

# The moments view's expand or collapse. Section 11: 60 ms.
#
# One indexed read of `v_moment_summary` plus one of `moment_images` for the
# stack being opened. Measured on the Rust side as the data the UI waits on; the
# React half is asserted separately in `MomentStack.test.tsx`, which is where a
# render cost would show up.
[stage.moments_stack_expand]
max_elapsed_ms = 60

# Section 11: extra storage per image, 200 bytes. **WAIVED at 340**, by PERF and
# CTO, in docs/adr/ADR-0017-burst-grouping-and-duplicate-policy.md section 8.
#
# The schema was shaped by the 200 rather than merely measured against it:
# `moment_images` carries no `project_id` (unlike `segment_images` and `faces`), a
# burst is a column rather than a table, the membership table has exactly one
# index, and a `variant` duplicate set is not stored at all. Those four decisions
# took the measured figure from 720 bytes per photograph to 319.
#
# The remaining 119 cannot be recovered inside this phase. The measured
# decomposition on a 1,000-frame project, from `PRAGMA page_count`:
#
#   moment_images rows      90 B/image   two prefixed UUIDs and two integers
#   its unique index        85 B/image   photo_id -> moment_id
#   moments rows            88 B/image   amortised over 3.3 frames per moment
#   its three indexes       55 B/image   project+time, segment, locked
#
# 175 of the 319 is **text ids at 40 characters each**, which is phase 01's
# decision and not this phase's to undo, and 46 is `moments.reasons`, which
# invariant 2 requires. Meeting 200 means breaking one of those two.
#
# The waiver is at 340 rather than at 319 so that a project with more duplicate
# sets than the fixtures produce does not turn a recorded waiver into a red gate;
# it expires if either phase 01's id format changes or a phase needs the headroom.
[size.moment_store_per_1000_images]
max_bytes = 340000

# ---------------------------------------------------------------------------
# Phase 09 performance budgets, from PHASE-09 section 11.
#
# Section 11's first row - 45 ms per image on a GPU - is **not here**, for the
# reason phase 03's two throughput rows are not: this build has no GPU backend
# (docs/adr/ADR-0007-inference-runtime.md), and a budget nothing can measure is
# a wish rather than an assertion. It is waived with its reason in
# docs/adr/ADR-0019-frame-integrity-and-eye-intent.md section 9, and the waiver
# expires when a GPU backend lands.
#
# Its third row - 4,000 images on an RTX 4070 in 180 s - is the same claim about
# the same absent hardware. What is asserted instead is the processor path, which
# is the path this build actually runs, and the per-image row below multiplied by
# four thousand is printed beside it so a reader can see what a full wedding
# costs on the machine CI ran on.
# ---------------------------------------------------------------------------

# One image, decoded buffer in, verdict out. Section 11: 220 ms on the CPU path.
#
# Everything phase 09 adds: the luminance plane, four region sharpnesses, two
# structure tensors, the clipping counts with the specular exclusion, the
# mixed-light histogram, the noise tiling, one aligned crop per face, the flags,
# the reasons and the composite. The decode is deliberately excluded - it is
# phase 02's cost and `preview_budgets` owns it.
[stage.integrity_analyse_image]
max_elapsed_ms  = 22000
max_ms_per_unit = 220

# Section 11: 1 KB per image including per-face eye states.
#
# The most generous storage budget in the product, and it is spent almost
# entirely on one column: `image_integrity.reasons`, a JSON array of at most six
# objects each carrying an evidence rectangle. That is section 13's last
# acceptance criterion - the card shows the exact crop that caused each penalty -
# and it is the difference between a technical verdict a photographer can argue
# with and one they can only accept or switch off.
#
# Measured on a real catalog before and after, over a thousand photographs, by
# `crates/aura-perf/tests/integrity_budgets.rs`. The figure is `dbstat` payload
# over migration 9's two tables and their indexes: 927 B per image today, of
# which 649 is the verdict row and its index and 278 is three eye states.
#
# It was whole-file `PRAGMA page_count` first, and that was the wrong instrument
# for this budget. Page accounting quantises to 4 KiB, a thousand verdicts sit in
# about 250 pages, and phase 09 then recorded the figure as "1,024 B, met,
# exactly" - a number that can only move in 4 KiB steps, pinned with zero
# headroom. The next change that touched a row moved it two pages to 1,032 B and
# the budget failed on packing drift rather than on anything anybody wrote. A
# payload figure moves by the bytes that were actually added.
#
# Page overhead did not stop being real: the same test asserts it as a bounded
# ratio to the payload (1.11x measured, 1.40x ceiling), where a schema change
# that makes the overhead structural still fails and ordinary packing does not.
[size.integrity_store_per_1000_images]
max_bytes = 1024000

# ---------------------------------------------------------------------------
# Phase 10 performance budgets, from PHASE-10 section 11.
#
# Section 11's first row - 40 ms per image on a GPU - is **not here**, for the
# reason phase 09's 45 ms row is not: this build has no GPU backend
# (docs/adr/ADR-0007-inference-runtime.md), and a budget nothing can measure is
# a wish rather than an assertion. It is waived with its reason in
# docs/adr/ADR-0021-emotion-taxonomy-and-moment-ranking.md section 9, and the
# waiver expires when a GPU backend lands.
#
# Its second row - 4,000 images on an RTX 4070 in 160 s - is the same claim about
# the same absent hardware. What is asserted instead is the processor path, and
# the per-image row below multiplied by four thousand is printed beside it so a
# reader can see what a full wedding costs on the machine CI ran on.
#
# The third row is the one this phase can most honestly assert: peaks and
# reaction linking open **no file at all**, so eight seconds is a claim about SQL
# and arithmetic that holds on any machine.
# ---------------------------------------------------------------------------

# One image, decoded buffer in, scored reading out. Everything phase 10 adds:
# one 112 px warp per face, the batched expression call, the 160 px four-plane
# resample the interaction tensor needs, the interaction call, the gaze geometry,
# the nine features, the ranker and the reasons.
#
# The decode is deliberately excluded - it is phase 02's cost and
# `preview_budgets` owns it.
# **The two heads are planted here, and the number is smaller than it looks.**
# `PlantedInfer` returns a fixed tensor, so what is measured is the arithmetic
# around the heads rather than the heads themselves - which is where phase 10's
# per-frame cost actually is, and which is the same arrangement phase 09's
# `integrity_analyse_image` uses with `NullInfer`. The measured figure on the
# development machine is **12 ms**; the budget is set at 60 with five times that
# headroom, because a CI machine is not this one.
#
# The end-to-end number, through the real interpreter and the real registry, is
# printed by `aura-cli verify --phase 10` and recorded in the phase 10 exit
# report. That is the honest place for it: a budget file that claimed a
# whole-pipeline figure measured against a stub would be a budget that passes
# when the runtime regresses.
[stage.emotion_read_image]
max_elapsed_ms  = 2400
max_ms_per_unit = 60

# Section 11: peak detection and reaction linking for a whole wedding in 8 s.
#
# Asserted rather than waived, because this row involves no hardware this build
# does not have: the window scan and the resolver read stored numbers. What could
# go wrong here is a quadratic scan, and four thousand frames is where that stops
# being invisible.
[stage.emotion_link_project]
max_elapsed_ms  = 8000
max_ms_per_unit = 8000

# Section 11: 900 B per image.
#
# Less than phase 09's kilobyte for a row that carries per-face readings as well,
# which is why three decisions in migration 10 exist: the eight expression
# channels are per-mille integers rather than REALs, `face_expression` carries no
# identity and no timestamp, and `reasons` stores codes rather than sentences.
#
# Measured with `PRAGMA page_count` on a real catalog before and after, over a
# thousand photographs, by `crates/aura-perf/tests/emotion_budgets.rs`.
[size.emotion_store_per_1000_images]
max_bytes = 850000

# ---------------------------------------------------------------------------
# Phase 11 performance budgets, from PHASE-11 section 11.
#
# The <=30 ms per-image row and <=120 s for 4,000 images both name an RTX 4070.
# This build has no GPU backend (ADR-0007), so neither is relabelled as a CPU
# assertion. `composition_budgets` measures the processor path, prints the
# 4,000-image extrapolation and states the waiver on every run. The row below is
# a regression guardrail for that current path, not a claim that CPU == RTX 4070.
# It times the current shipping path at the real 2048 px proxy size, including
# explicit withholding of both untrained heads; direct interpreter execution is
# covered separately by the phase 11 CLI gate.
# ---------------------------------------------------------------------------

[stage.composition_analyse_image_cpu]
max_elapsed_ms  = 6000
max_ms_per_unit = 500

# Section 11: <=800 B per image. Measured with SQLite page accounting before
# and after 1,000 judgements cycling through the complete authored fixture
# corpus: clean, tilted, intentional, cropped, merged, bright and colour-clash
# frames, including evidence and crop hints where the analyser emits them.
[size.composition_store_per_1000_images]
max_bytes = 800000

# ---------------------------------------------------------------------------
# Phase 12 performance budgets, from PHASE-12 section 11.
#
# Four rows are named there. Two of them - "full analysis + cull of 3,000 images
# in under 8 minutes on an RTX 4070" and the same on an M3 Pro - are budgets for
# the *analysis*, which is phases 06 to 11, on hardware this build does not have.
# They are not asserted here and they are not relabelled as CPU numbers; ADR-0007
# waives the GPU rows and phases 09, 10 and 11 each carry their own share of the
# eight minutes. What is left is the part phase 12 actually owns, and both of its
# rows are asserted below.
#
# Phase 12 opens no image file, decodes nothing and runs no model. Every number
# it fuses was computed by an earlier phase and stored, which is why the passes
# are budgeted in seconds while the analysis underneath them is budgeted in
# minutes. That is invariant 3 arriving at its conclusion.
# ---------------------------------------------------------------------------

# Section 11: the selection passes over 4,000 analysed images, in <= 1.5 s.
#
# All six of them: fusion, moment, chapter, coverage, diversity, sizing and
# coverage again. Measured over the pure engine, which is the honest boundary -
# the gather in front of it is a catalog read whose cost belongs to SQLite and
# is guarded by the phase 01 rows.
[stage.cull_select_4000]
max_elapsed_ms  = 1500
max_ms_per_unit = 1500

# Section 11: a slider move re-selects in <= 2 s.
#
# The same six passes at a new target, which is why the number is close to the
# row above rather than a fraction of it. Section 6.4 promises the slider does
# not re-run the analysis, and it does not; it re-runs the allocation, and the
# allocation is what this measures.
[stage.cull_resize_4000]
max_elapsed_ms  = 2000
max_ms_per_unit = 2000

# Section 11 sets no per-image storage budget for this phase. This row exists
# anyway, because the absence of a stated budget is not the absence of a
# measurement - and a selection is one row per photograph in two tables plus a
# reason array, which is exactly the shape that grows quietly.
#
# 700 B per image, tighter than phase 11's 800 B for a row that carries two
# tables' worth of decision, and the same three decisions pay for it: a reason
# stores its code rather than its sentence, the sub-scores are columns rather
# than JSON, and there is one index per table.
#
# Measured with SQLite page accounting before and after a real selection over
# 1,000 photographs by `crates/aura-perf/tests/cull_budgets.rs`.
[size.cull_store_per_1000_images]
max_bytes = 700000

# ---------------------------------------------------------------------------
# PHASE-13. The decision ledger.
#
# Section 11 names four rows. Three are here; the fourth - "Explain panel open
# (with crops) <= 250 ms" - is a rendering budget that includes a web view and a
# preview service, neither of which exists inside a Rust test. What is asserted
# instead is the read that feeds it, at a tenth of the figure, and the phase 13
# gate prints the measured panel read so the number is never merely claimed.
# ---------------------------------------------------------------------------

# Section 11: a ledger write costs <= 0.4 ms amortised.
#
# One transaction with two inserts - the decision and its reasons - which is why
# the two are budgeted together rather than separately: a decision whose reasons
# failed to write is a decision that was not recorded at all, so there is no
# intermediate state worth timing.
[stage.ledger_write_4000]
max_elapsed_ms  = 1600
max_ms_per_unit = 1

# Section 11: one decision replays in <= 1 s, which starts with reading it back.
#
# 25 ms, not one second: the replay's budget is dominated by re-deriving the
# decision, and a read that took anywhere near a second would mean the subject
# index was not being used.
[stage.ledger_read_one]
max_elapsed_ms  = 25
max_ms_per_unit = 25

# Section 11: <= 6 MB of ledger per 1,000 images for a full pipeline.
#
# This row is stated per *decision* rather than per image, which is the honest
# denominator: a cull writes one decision per photograph and the five kinds no
# phase writes yet will each write more. 6 MB per thousand decisions is therefore
# the same budget read the strictest way - if every one of the six kinds fills it,
# the figure holds at one sixth each.
#
# Measured with SQLite page accounting before and after recording 1,000 real
# decisions by `crates/aura-perf/tests/ledger_budgets.rs`.
[size.ledger_store_per_1000_decisions]
max_bytes = 6291456

# ---------------------------------------------------------------------------
# PHASE-14. The develop engine.
#
# Section 11 names five rows and **four of them name a GPU**: the 2048 px proxy at 60 ms on
# an RTX 4070 and 110 ms on an M3 Pro, the 45 MP export at 900 ms, and batch export at
# 1.2 images/s. This build links no wgpu backend (docs/adr/ADR-0029-render-pipeline.md
# section 4), so none of the four is asserted and none is relabelled as a processor number.
# They are waived, with an expiry that is the same one ADR-0007 carries: the waiver ends when
# a GPU backend lands.
#
# The fifth row is the one this build actually runs - "full 45 MP render (CPU fallback)
# <= 6 s" - and it is asserted below, stated per megapixel so a test can measure a smaller
# frame and still fail on a regression.
#
# Two rows section 11 does not state are here as well. The interactive proxy on the
# processor path, because the develop panel's responsiveness is the phase's headline claim
# and a budget nobody asserts is a claim nobody can break; and the storage row, because a
# recipe plus its history is one row per photograph across two tables and that is precisely
# the shape that grows quietly.
# ---------------------------------------------------------------------------

# Section 11: a full 45 MP render on the processor fallback, in 6 s.
#
# Stated per megapixel - 133 ms - so the suite can time a 4 MP frame and still catch a
# regression, and so the number does not silently become easier when somebody changes the
# fixture's size. The full pipeline runs: white balance, the matrix, noise reduction, the
# whole point-wise grade, clarity, texture, sharpening, the crop and the output transform.
[stage.render_full_cpu_per_megapixel]
max_elapsed_ms  = 6000
max_ms_per_unit = 133

# The interactive proxy at 2048 px, on the processor path.
#
# Section 11's 60 ms is an RTX 4070 figure and is waived. This row is its processor
# counterpart and it is a **regression guardrail rather than a claim of parity**: measured at
# 210 ms in release on the development machine with the reference grade, budgeted at 450 ms,
# which fails on a two-times regression.
#
# The 450 originally said it "leaves room for a slower CI machine". **It does not**, and that
# assumption is what made this suite red on `main` for five days in August 2026. Measured on
# three GitHub runners: 497 ms (macOS), 669 ms (ubuntu, tests lane) and 1,123 ms (ubuntu,
# benchmarks lane) - two and a half to five times the development machine rather than the
# under-two-times the figure assumed.
#
# The room for a slower host is now explicit instead: `AURA_PERF_HOST_SCALE`, which CI sets
# and a developer does not, multiplies every timing budget in this file. See
# `crates/aura-perf/src/lib.rs`. At the scale CI sets this row allows 1,800 ms, which is 60 %
# clear of the slowest figure ever observed and still fails on a regression - so the guardrail
# is real on both machines rather than tight on one and absent on the other.
#
# The gap between 60 and 210 is the honest cost of having no GPU backend, it is printed by
# `aura-cli verify --phase 14` on every run, and it is condition C1 in the exit report.
[stage.render_proxy2048_cpu]
max_elapsed_ms  = 450
max_ms_per_unit = 450

# Re-rendering the proxy after a slider move, when only a late stage was invalidated.
#
# Section 6.3's invalidation rule is what this measures: moving saturation must not re-run
# white balance, the tone curve or noise reduction. Budgeted at half the full proxy render,
# because a late-stage re-render that costs the same as a full one means the invalidation is
# not being used.
[stage.render_proxy_slider_cpu]
max_elapsed_ms  = 225
max_ms_per_unit = 225

# The canonical serialisation and hash of one recipe, which happens on every save, every
# render-cache lookup and every export. Measured over 1,000 recipes so a sub-millisecond
# budget is expressible in whole milliseconds.
[stage.recipe_canonical_1000]
max_elapsed_ms  = 1000
max_ms_per_unit = 1

# Section 11 sets no storage budget for this phase. **12 KB per image**, and it is the
# largest per-image figure in the product by an order of magnitude. The number is set at the
# measurement rather than the measurement squeezed to a number, and the reason is written
# here so it can be argued with:
#
# The measured decomposition on 1,000 photographs each carrying one automated edit and three
# manual steps, from `PRAGMA page_count`:
#
#   edit_recipes.body        1,412 B/image   the canonical recipe, exactly as hashed
#   edit_recipes, the rest     380 B/image   two prefixed ids, the hash, provenance columns
#   edit_history bodies      4,236 B/image   three steps x one complete document
#   edit_history, the rest     450 B/image   the changed-path array, the label, two stamps
#   indexes and page slack   ~4,500 B/image  four indexes and SQLite's own overhead
#
# **The history bodies are the budget**, and they are a whole document per step on purpose.
# `aura_recipe::history`'s module documentation has the argument: a chain of deltas is exact
# only if every delta was computed against the state that actually preceded it, and that
# stops being true the first time a merge refuses a protected path and the proposal and the
# result diverge. An undo that is *nearly* right is worse than no undo.
#
# Two reductions were considered and rejected. Storing a delta per step and a full document
# every tenth step would cut this by about half and makes undo depend on replaying a chain -
# the thing above. Compressing the bodies would cut it by about three quarters and needs a
# compressor in the dependency tree for a saving that a bounded history already caps.
#
# What *does* cap it is the bound: `history::MAX_ENTRIES` is 100 and `RecipeStore::save`
# trims on write, so the worst case is about 150 KB for a photograph somebody worked hard on
# - and the typical case is the four steps measured here.
#
# Measured with SQLite page accounting before and after by
# `crates/aura-perf/tests/develop_budgets.rs`.
[size.develop_store_per_1000_images]
max_bytes = 12288000

# PHASE-15. One frame's exposure and white balance on the processor path: one 2048 px proxy,
# the statistics pass, the neutral detector, four hypotheses, the constrained solve and the
# exposure clamp. Section 11's 25 ms row names a GPU and this build has no GPU backend
# (ADR-0007), so that row is waived and this guards what actually ships.
[stage.tone_estimate_frame]
max_elapsed_ms  = 6000
max_ms_per_unit = 500

# Section 11 budgets **600 B per image** and this build does not meet it. The number below is
# the measurement, and the reason it is here rather than a smaller number in the schema is
# written out so it can be argued with:
#
# The measured decomposition on 1,000 photographs, from `PRAGMA page_count`:
#
#   measured total             807 B/image   over 1,000 photographs
#
# and the shape of it, from the encoder's own widest-row figures in
# `tone::store::codec` plus what the schema and the indexes add:
#
#   illuminants document      ~130 B/image   two localised lights, six positions each
#   reasons document          ~220 B/image   up to six codes, two carrying numbers
#   alternatives document     ~105 B/image   three runner-up colours
#   twenty-two scalars        ~180 B/image   including two prefixed ids and a timestamp
#   three indexes and slack   ~170 B/image   one covering index and two partial ones
#
# **The three documents are two thirds of the row**, and every reduction that would fit them
# inside 600 B was considered and rejected:
#
#   * Dropping `alternatives` saves about 105 B and removes section 5's own field. A panel
#     that offers a runner-up without saying what it cost is asking the photographer to guess.
#   * Shortening the reason codes to integers saves about 90 B and creates a second reason
#     vocabulary that a catalog written by a newer build cannot be read with. Phase 09's rule
#     runs the other way.
#   * Dropping the evidence rectangles saves about 55 B and removes the crop behind every
#     mark, which is what invariant 2 means by an explanation.
#   * Storing one shared illuminant per moment rather than per frame saves about 100 B and is
#     wrong: two frames of one moment under mixed light have different dominant illuminants,
#     which is the case the phase exists for.
#
# What *was* done: positional arrays instead of objects (about half), reasons store their code
# rather than their sentence (phase 09's rule, fourth migration running), every derived value
# is derived on read rather than stored, and every float is written at the precision it can
# survive - a temperature and a tint as integers, because `aura_recipe::Global` stores them as
# `u32` and `i16`.
#
# The waiver is recorded in `docs/progress/PHASE-15-EXIT.md`. At the measured figure a
# 4,000-image wedding costs about 3.2 MB, against about 4 MB for phase 09's verdicts and 48 MB
# for phase 14's recipes - so the row is over its own budget and remains a small part of a
# catalog. That is the trade, stated rather than hidden by a smaller schema.
#
# Measured with SQLite page accounting before and after by
# `crates/aura-perf/tests/tone_budgets.rs`.
[size.tone_store_per_1000_images]
max_bytes = 900000

# PHASE-19. One frame's local light plan on the processor path: one 2048 px proxy read once,
# the region statistics, the joint face solve, the paired subject/background move, the
# three-band frequency separation of every shapeable face, the shaping grids, the specular
# search and the governor.
#
# Section 11's own row is **80 ms per image** and it names the reference machines. This build
# has no GPU backend (ADR-0029 section 4), so what is guarded here is the processor path, at
# the same ratio phase 15's row uses. Section 11's second row - 12 ms of render overhead for
# the local application - is waived twice over: there is no `wgpu` backend to measure and no
# phase 18 matte to apply through, so the application costs nothing because it does not
# happen. Its third row, 1,000 selected images in 90 s, is extrapolated from the per-image
# figure and printed by the test rather than asserted separately.
[stage.local_plan_frame]
max_elapsed_ms  = 14000
max_ms_per_unit = 500

# Section 11 names **no storage row for this phase**. One is measured anyway, against the 1 KB
# per image every phase since 09 has aimed at, because a decision table that quietly costs
# four kilobytes a frame is a catalog nobody can back up and section 11 not asking is not a
# reason not to know.
#
# The measured decomposition on 1,000 photographs, from `PRAGMA page_count`, over the widest
# rows the fixtures produce - a group formal with four lit faces, ten shaping zones each and
# eight reasons:
#
#   the plan row and its three indexes   503 B/image
#   the lit faces                        249 B/image   one row per face, ~180 B each
#   the reasons document                 143 B/image   up to eight codes with evidence
#   the shaping document                 114 B/image   four numbers per shaped face
#   the gates                              0 B/image   inside the pages above
#                                      -----
#   measured total                     1,064 B/image
#
# **It started at 2,236 B.** Two reductions took it here, and the first is the one worth
# reading:
#
#   * The shaping was a `WITHOUT ROWID` child table with one row per zone, and ten zones on
#     each of four faces cost 1,286 B/image on its own - more than half the table. Every
#     zone's centre and radius is a fixed proportion of the face region and its gain is a
#     fixed base scaled by the light direction and the strength, so the whole list is a pure
#     function of four numbers. The catalog stores the four and `dodgeburn::zones_for`
#     reproduces the list exactly: 114 B/image, and the panel still shows every zone by name
#     because they are regenerated on read. This is the same argument as storing zones rather
#     than grids, taken one step further, and it is why `shaping_ver` exists - a change to the
#     derivation moves delivered pixels without moving a stored number.
#   * Everything derivable is derived rather than stored, which is the rule migration 15 wrote
#     for its illuminants.
#
# Two further reductions were considered and rejected:
#
#   * Folding the lit faces into a document saves about 200 B/image and removes
#     `idx_local_face_identity`, which is the index phase 20 joins on to avoid retouching a
#     face this phase has already lifted. A document cannot be joined, and the alternative is
#     phase 20 scanning every plan in a wedding.
#   * Storing reason codes as integers saves about 60 B/image and creates a second reason
#     vocabulary a catalog written by a newer build cannot be read with. Phase 09's rule runs
#     the other way, for the fifth migration running.
#
# The six per-operation strengths are columns rather than a document, which costs a little
# more than a JSON object would and is what makes the outline's histogram, the review queue
# and phase 20's "has this already been evened" query one aggregate each rather than a scan
# with a JSON extract per row.
#
# At the measured figure a 4,000-image wedding costs about 4.1 MB, against about 3.2 MB for
# phase 15's tone estimates and 48 MB for phase 14's recipes.
#
# Measured with SQLite page accounting before and after by
# `crates/aura-perf/tests/local_budgets.rs`.
[size.local_store_per_1000_images]
max_bytes = 1100000

# ---------------------------------------------------------------------------
