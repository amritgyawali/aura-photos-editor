# Phase 01 performance budgets, from PHASE-01 section 11.
# Each entry is asserted by a test or a benchmark; a breach fails CI.

[stage.ingest_4000_files]
max_elapsed_ms  = 90000
max_ms_per_unit = 20

[stage.catalog_open]
max_elapsed_ms = 400

[stage.timeline_recompute_4000]
max_elapsed_ms = 1000

[stage.reimport_noop_4000]
max_elapsed_ms = 5000

# Phase 02 performance budgets, from PHASE-02 section 11.

# Tier 1: the camera's embedded JPEG for 4,000 files on 8 cores.
[stage.tier1_embedded_4000]
max_elapsed_ms  = 180000
max_ms_per_unit = 45

# Tier 2: the 2048 px proxy, CPU-only path. The GPU-assisted budget of 120 ms
# is not asserted here because this build has no GPU path; see
# docs/adr/ADR-0004-raw-decode-backend.md.
[stage.tier2_proxy]
max_elapsed_ms  = 250
max_ms_per_unit = 250

# Tier 3: full sensor resolution, tiled, on a 45 MP frame.
[stage.tier3_full]
max_elapsed_ms = 1800

# A preview already in the cache. This is the number that decides whether
# scrolling feels instant.
[stage.preview_cache_read]
max_elapsed_ms = 8

# Sizes are budgets too: a cache that quietly grows fills the drive the wedding
# is being edited from.
[size.cache_per_1000_images]
max_bytes = 3758096384  # 3.5 GB

[size.peak_rss_batch_proxy]
max_bytes = 2684354560  # 2.5 GB

# Phase 03 performance budgets, from PHASE-03 section 11.
#
# The two GPU throughput rows in that section - 220 img/s on an RTX 4070 and
# 110 img/s on an M3 Pro - are not here, because this build has no GPU backend
# and a budget nothing can measure is a wish. They are waived with their reasons
# in docs/adr/ADR-0007-inference-runtime.md and the waiver expires when a GPU
# backend lands.

# One model, parsed, compiled and its weights rounded, with nothing cached.
[stage.cold_model_load]
max_elapsed_ms = 900

# The scheduler's own cost, measured over 1,000 admissions so a 0.4 ms budget is
# expressible in whole milliseconds.
[stage.infer_admission_1000]
max_elapsed_ms  = 400
max_ms_per_unit = 1

# The processor path with a quantised model: section 11 asks for 18 images per
# second, which is 55 ms per image.
[stage.infer_embedding_cpu_int8]
max_elapsed_ms  = 3000
max_ms_per_unit = 55

# Enumerate the providers, run the reference model twenty times on each, decide.
[stage.hardware_probe]
max_elapsed_ms = 15000

# Loading the models a project open needs before the photographer sees anything.
[stage.warmup_startup_models]
max_elapsed_ms = 2500
