# =================================================================================================
# PHASE-24. Generative cleanup.
#
# Section 11 sets five time budgets and no storage row. Four of the five are written about
# operations at full resolution on hardware this build does not link, so they are recorded here
# against the **proxy** the decision path actually runs on, and the exit report says which is which.
# =================================================================================================

# Candidate detection on a 2048 px proxy. Section 11 budgets 45 ms per image at full resolution;
# this pass opens no pixels of its own for detection at all - phase 11 measured the salience, phase
# 06 found the subjects - so what is being measured is the ranking and the cap.
[stage.cleanup_detect]
max_elapsed_ms  = 6000
max_ms_per_unit = 6

# The classical fill of one region on a proxy. Section 11 budgets 400 ms per region at 45 MP; the
# exemplar search is quadratic in the source window and the window scales with the region, so a
# proxy region costs a small fraction of that.
#
# **This is the number to watch when the region cap moves.** The search is O(hole x window) and the
# window is `RING_REACH` times the hole, so doubling the area cap quadruples the work.
[stage.cleanup_fill]
max_elapsed_ms  = 20000
max_ms_per_unit = 200

# The sibling borrow of one region on a proxy. Section 11 budgets 700 ms per region. The cost is
# the block match - twelve control patches over a 49-by-49 search window - plus 495 four-subset
# homography solves, and the second of those is deliberately exhaustive rather than sampled:
# invariant 4 needs the fit to be reproducible, and at twelve points an exhaustive least-median is
# cheaper than seeding a generator.
[stage.cleanup_borrow]
max_elapsed_ms  = 35000
max_ms_per_unit = 350

# The artefact self-check over one patched result. Three measurements, and the expensive one is the
# frame-wide step percentile, which is bucketed rather than sorted and strided rather than
# exhaustive for exactly this reason.
[stage.cleanup_selfcheck]
max_elapsed_ms  = 12000
max_ms_per_unit = 120

# Section 11 names no storage row for this phase. One is measured anyway, and **the first figure
# written here was wrong by a factor of two and a half** because it was written before it was
# measured - phase 21's defect, committed by the phase whose own progress note describes it.
# `crates/aura-perf/tests/cleanup_budgets.rs` now prints the per-object breakdown on every run.
#
# Measured over 1,000 photographs of the widest plan the fixtures produce - one examined image,
# three proposals and six refused candidates - as the change in `dbstat` payload rather than in
# `PRAGMA page_count`, which quantises to 4 KiB:
#
#   cleanup_proposal                     1,008 B/image   three rows, ~336 B each
#   cleanup_blocked (WITHOUT ROWID)        662 B/image   six rows, ~110 B each
#   idx_cleanup_blocked_check              446 B/image
#   idx_cleanup_proposal_photo             162 B/image
#   idx_cleanup_proposal_queue             162 B/image
#   cleanup_image                          139 B/image
#   idx_cleanup_proposal_project           138 B/image
#   idx_cleanup_image_project               46 B/image
#                                       --------
#   measured total                       2,763 B/image
#
# Nearly three kilobytes, for two structural reasons.
#
# The first is phase 21's: every phase from 09 to 20 stored one fixed-width verdict per photograph,
# and this stores a *list* whose length is the number of things the pass considered.
#
# The second is this phase's own, and it is the interesting one: **the refusals and their index are
# 1,108 B of the total, forty per cent.** They cost more than the proposals do. Phase 23 faced the
# same choice for its rejected crop rectangles and went the other way - four counters instead of
# rows - and the difference is what the rows are for. Phase 23's rejects are search intermediates;
# these are decisions, section 10.1's adversarial audit is scored from them, and "AURA declined to
# touch this photograph" is unprovable from a counter.
#
# Two reductions were considered and rejected:
#
#   * Dropping `idx_cleanup_blocked_check`, saving 446 B/image. It is the index the panel's refusal
#     histogram and the audit both read, and without it both become a full scan of the largest
#     table in the schema.
#   * Dropping `artefact_score` from proposals that were never applied. Rejected because the
#     artefact-free gate is measured over approved removals, and a figure that existed only on
#     applied rows would be measuring the set that had already passed.
#
# At the measured figure a 4,000-image wedding costs about 11 MB, against 3.4 MB for phase 23's
# geometry plans and 48 MB for phase 14's recipes. The budget carries headroom over the
# measurement, which is phase 19's correction: a budget must not be pinned at its own measurement.
[size.cleanup_store_per_1000_images]
max_bytes = 3200000

# ---------------------------------------------------------------------------
# PHASE-25 - gallery consistency
# ---------------------------------------------------------------------------
#
# Section 11's four rows. Three of them are measured in
# `crates/aura-perf/tests/gallery_budgets.rs`; the fourth - the strips render - is a browser
# measurement and belongs to the UI suite, so what is measured in its place is the **query** a strip
# is drawn from, which is the half that scales with a wedding.
#
# The pass is fast for a structural reason worth writing down: it opens no pixels. Every number it
# works on was stored by phases 07, 15 and 16, so a thousand-image wedding is a thousand rows read,
# ten trees built and ten targets solved. Measured at 74 ms against a 60 s budget - three orders of
# magnitude of headroom, which is not a sign the budget is wrong but a sign this phase is arithmetic
# over other phases' answers rather than a pass over photographs.
#
# The skin half will not be free in the same way, and the budget below is written knowing that:
# when phase 18's segmenter is trained, every selected frame gains one proxy decode and one masked
# statistic. That is why the pass row keeps the whole 60 s rather than being re-based onto the
# measurement - phase 22's rule about waived rows read forwards.
[stage.gallery_pass_1000]
max_elapsed_ms  = 60000
max_ms_per_unit = 60

# One anchor change re-solves that node and no other. Measured at 1 ms.
[stage.gallery_anchor_resolve]
max_elapsed_ms  = 6000
max_ms_per_unit = 6000

# The query one timeline strip is drawn from. Measured at under a millisecond for a 100-frame node.
[stage.gallery_strip_query]
max_elapsed_ms  = 400
max_ms_per_unit = 400

# Section 11's storage row, and the second tightest figure in the product after phase 09's 1 KB.
#
# **Measured before it was written down.** Phase 21 shipped a per-image figure that had been written
# first and was wrong by a factor of two and a half; phase 19's correction is the other half of the
# rule, that a budget must not be pinned at its own measurement either.
#
# Measured over 1,000 photographs of a ten-chapter wedding, as the change in `dbstat` payload rather
# than in `PRAGMA page_count`, which quantises to 4 KiB - phase 09's correction:
#
#   gallery_delta                227 B/image   one row per photograph, the whole phase in it
#   idx_gallery_delta_project     46 B/image
#   idx_gallery_delta_node        44 B/image
#   gallery_anchor                 3 B/image   four rows per node, ten nodes
#   idx_gallery_anchor_photo       3 B/image
#   gallery_node                   3 B/image
#                               --------
#   measured total               330 B/image
#
# Two decisions are why this is 330 rather than about 500.
#
# **Node membership is the delta table.** Section 5's `SceneNode::image_ids` is not a join table:
# every placed frame gets a delta row, including the ones that moved by nothing, so `WHERE node_id =
# ?` is the membership query. A separate table would have cost about 85 B per image - a sixth of the
# whole budget - to store a fact already on the row beside it.
#
# **A reason set is one integer.** Twenty-six codes in a bitmask over `GalleryCode::ALL`, 8 B where a
# list of slugs would have been about sixty. Phase 09's rule - a reason stores its code rather than
# its sentence - taken one step further, and the *weight* is a property of the code rather than of
# the frame so it is rendered on read like the sentence is.
#
# The measured figure carries no outlier rows, because the perf fixture's chapters drift within what
# the bounds can reach and produce none. An outlier row is about 110 B and a real wedding produces
# them on a small percentage of frames, so the true figure is a few bytes higher than 330 - well
# inside the headroom, and named here rather than discovered later.
[size.gallery_store_per_1000_images]
max_bytes = 500000

# ---------------------------------------------------------------------------
# PHASE-26 - camera and shooter matching
# ---------------------------------------------------------------------------
#
# Section 11's three rows, all of them per *wedding* rather than per photograph - the second phase in
# a row whose budgets have that shape, and for the same reason phase 25's do: a fingerprint is an
# aggregate over everything a body shot, a pair is a relationship between two frames, and a transform
# is solved once per body. There is no per-frame unit to divide by that would mean anything.
#
# Measured in `crates/aura-perf/tests/camera_budgets.rs` over a two-body, thousand-frame synthetic
# wedding: discovery 1 ms, the whole pass 35 ms, 17 ms per camera. Three orders of magnitude inside
# every row, for the reason phase 25's pass is: **it opens no pixels.** Every number it works on was
# stored by phases 15, 16 and 25.
#
# The budgets keep their full section 11 values rather than being re-based onto the measurement, and
# the reason is named rather than left to be discovered: this build measures **no skin**, because
# phase 18's segmenter is untrained. When it is, every fingerprint gains one masked statistic per
# contributing frame and the fingerprinting stage stops being arithmetic over stored rows. Phase 22's
# rule about waived rows, read forwards.
[stage.camera_discovery]
max_elapsed_ms  = 18000
max_ms_per_unit = 18000

[stage.camera_solve]
max_elapsed_ms  = 1000
max_ms_per_unit = 1000

[stage.camera_pass]
max_elapsed_ms  = 25000
max_ms_per_unit = 25000

# Section 11 names no storage row. One is measured anyway, and it is the first in the product whose
# shape is **bounded rather than proportional**.
#
# `pairs::find` truncates at `MAX_PAIRS_PER_CAMERA` verified pairs and the same number again of
# rejected ones, so a two-body wedding stores a fixed number of pairs whether it is 200 frames or
# 4,000. Everything else is one row per body per flash state, one per shooter and one per project.
# Measured:
#
#   camera_pair                     44 B/image   capped, not proportional
#   idx_camera_pair_camera          10 B/image
#   camera_transform                 2 B/image   two bodies, two flash states
#   camera_fingerprint              <1 B/image
#   camera_shooter_bias             <1 B/image
#   camera_reference                <1 B/image
#                                 --------
#   measured total                  57 B/image over 1,000 photographs
#
# 57,724 B over a thousand frames and 57,729 B over two thousand - which is the property the test
# asserts, because a size assertion alone would pass on a build that had quietly removed the cap and
# happened to be measured on a small fixture.
#
# **The first version of this note said the pair table grew with the square of the overlap.** It was
# written before the measurement and was wrong about the *shape* rather than the size. Phase 21's
# rule covers the sentence as well as the number.
[size.camera_store_per_1000_images]
max_bytes = 150000
