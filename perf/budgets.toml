# four renders. Conflating them would be a budget that looks strict and measures the wrong
# thing.
[stage.retouch_plan_frame]
max_elapsed_ms  = 12000
max_ms_per_unit = 500

# Section 11 sets no storage row for this phase. One is measured anyway, against the kilobyte
# per image every phase since 09 has aimed at.
#
# The measured decomposition on 1,000 photographs over the widest rows the fixtures produce:
#
#   the plan row and its three indexes    486 B/image
#   the operations                        212 B/image   ~70 B each
#   the reasons                           178 B/image   up to twelve codes on a busy frame
#                                       -----
#   measured total                        876 B/image
#
# `retouch_protected` and `retouch_identity` are deliberately outside the figure: they are per
# *person* rather than per photograph, so a wedding with sixty identified people and four
# protect rows each costs about 20 KB in total and does not scale with the import.
#
# The budget is 1,000 B/image rather than the measured 876, and the headroom is deliberate:
# phase 19's own correction was that a budget measured with a quantised instrument must not be
# pinned at its own measurement, and this figure comes from `PRAGMA page_count`, which moves in
# 4 KiB steps.
[size.retouch_store_per_1000_images]
