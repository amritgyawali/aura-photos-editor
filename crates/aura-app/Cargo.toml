[package]
name = "aura-app"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
publish.workspace      = true
description = "AURA application layer: typed IPC command surface shared by the desktop shell and the CLI."

[dependencies]
aura-core    = { path = "../aura-core" }
aura-catalog = { path = "../aura-catalog" }
aura-ingest  = { path = "../aura-ingest" }
aura-jobs    = { path = "../aura-jobs" }
aura-cache   = { path = "../aura-cache" }
aura-preview = { path = "../aura-preview" }
aura-raw     = { path = "../aura-raw" }
aura-infer   = { path = "../aura-infer" }
aura-models  = { path = "../aura-models" }
aura-cloud   = { path = "../aura-cloud" }
aura-index   = { path = "../aura-index" }
aura-vision  = { path = "../aura-vision" }
aura-people  = { path = "../aura-people" }
aura-brain-gallery = { path = "../aura-brain-gallery" }
aura-brain-wedding = { path = "../aura-brain-wedding" }
aura-brain-photo   = { path = "../aura-brain-photo" }
aura-restore       = { path = "../aura-restore" }
aura-retouch       = { path = "../aura-retouch" }
aura-cull          = { path = "../aura-cull" }
aura-explain       = { path = "../aura-explain" }
aura-geometry      = { path = "../aura-geometry" }
# PHASE-24. The cleanup engine. `aura-app` is where the editorial-judgement port meets
# `aura-cloud`, and where an accepted proposal meets `aura_recipe::schema::merge` - the
# two edges `aura-generative` deliberately does not have.
aura-generative    = { path = "../aura-generative" }
aura-recipe        = { path = "../aura-recipe" }
aura-render        = { path = "../aura-render" }
aura-style         = { path = "../aura-style" }
# PHASE-27. The quality-control agent. `aura-qc` depends on none of the thirteen deciding
# crates; `AppState::qc_frame` is the adapter that reads them on its behalf, and `qc_commands`
# is where its `Field` port is implemented. That indirection is what stops `aura-brain-photo`
# depending on the crate that judges it.
aura-qc            = { path = "../aura-qc" }
blake3.workspace      = true
# PHASE-28. `AppProbe::sample` reads how much room is left on the volume the project lives on.
# It is the only one of the machine probe's seven readings this build can honestly fill; the
# other six need platform APIs this product does not link, and are `None`.
fs4.workspace         = true
rusqlite.workspace    = true
serde.workspace       = true
serde_json.workspace  = true
time.workspace        = true
tracing.workspace     = true
parking_lot.workspace = true
uuid.workspace        = true

[dev-dependencies]
tempfile.workspace = true
