[package]
name         = "aura-curate"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
publish.workspace      = true
description  = "Curation: monochrome suitability with a per-person measured skin band, portfolio heroes under three diversity constraints, an album sequenced inside inviolable chapter order, social and teaser sets, and captions from a closed vocabulary (phase 29)"

[dependencies]
aura-core    = { path = "../aura-core" }
aura-catalog = { path = "../aura-catalog" }
# PHASE-29. Phase 05's frozen `SimilarityIndex`, `ImageEmbedding` and `LumaStats`. Uniqueness is
# section 6.2's fourth hero term and the near-duplicate refusal is section 10.1's own property test,
# and both are questions about what a photograph looks like as a vector - which phase 05's rule says
# there is exactly one way to ask. The descriptors this crate reads were computed once, by phase 05,
# which is the other half of that rule.
aura-index   = { path = "../aura-index" }
# PHASE-29. The album sequencing and caption task of section 7. `CloudTask` is the only route to a
# model provider in this product - phase 04's rule, enforced by `scripts/check-banned.sh` - and the
# task in `sequence.rs` implements it. Its answers are *proposals*: a move is applied only when the
# local objective agrees it is an improvement, and a caption only when it passes the same closed
# vocabulary the local template passes by construction.
aura-cloud   = { path = "../aura-cloud" }
rusqlite     = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
toml         = { workspace = true }
tracing      = { workspace = true }

# Deliberately absent from the *library*: `aura-recipe`, `aura-render`, `aura-preview`, `aura-raw`,
# and every one of the deciding crates from `aura-brain-photo` to `aura-qc`. `aura-render` returns
# below as a dev-dependency and the distinction is the whole point - see the note on it there.
#
# `aura-recipe` and `aura-render` are absent for a reason sharper here than in `aura-geometry`,
# `aura-generative`, `aura-brain-gallery` or `aura-qc`. This phase proposes a **monochrome
# conversion**, which is the one thing in the product that would be trivial to just apply: the `bw`
# block phase 14 froze is two fields, `schema::merge` is one call away, and a photographer would see
# a beautiful result. That is exactly the product deciding a wedding is monochrome, and section 6.1
# says not to. `tests/no_outputs.rs` fails the build if this crate ever calls `merge`, opens a file,
# or grows a renderer.
#
# `aura-preview` and `aura-raw` are absent because **nothing in this phase opens a photograph**.
# Every reading is a number some earlier phase measured and stored - which is what makes a whole
# gallery affordable inside section 11's 20 s budget, and what makes each selector a pure function a
# test can drive with a literal.
#
# The deciding crates are absent because everything this phase needs from them it takes through the
# frozen traits in `aura-core`, assembled by `aura-app` into the `Field` port. A dependency in this
# direction would also be a cycle waiting to happen: `aura-cull` decides what is delivered and this
# crate curates what `aura-cull` chose, so the two must never be able to see each other.

[dev-dependencies]
tempfile     = { workspace = true }
# PHASE-29. `tests/store_round_trip.rs` parses every JSON export back, because "exports cleanly to
# external tools" is section 13's fifth acceptance criterion and a format nobody parsed is a format
# nobody has checked. The export itself is written by hand - ADR-0059 section 4 - so this is the
# consumer rather than the producer.
serde_json   = { workspace = true }
# PHASE-29, and a dependency that is deliberately *only* here. Section 10.1 asks whether a generated
# monochrome mix is better than a fixed preset, and that is a question about greys rather than about
# band weights: two mixes with different numbers can render the same photograph identically, and a
# mix that separated a red from a green on paper can collapse them on the pixel. So the gate measures
# through `aura_render::tonemap::monochrome`, which is the arithmetic that will actually run when a
# photographer accepts a proposal.
#
# Phase 16's rule - a guarantee about a pixel is enforced on the pixel - with phase 29's constraint
# on top of it: the library must not be able to render, because rendering is one call from applying,
# and applying is the product deciding a wedding is monochrome. A dev-dependency cannot be reached
# from the library at all, and `tests/no_outputs.rs` fails the build if `src/` ever names it.
aura-render  = { path = "../aura-render" }
# The `Bw` block `aura_render::tonemap::monochrome` takes. Here for the same reason and under the
# same guard: the library must not be able to write one.
aura-recipe  = { path = "../aura-recipe" }

# The section 10.1 gates, run as an ordinary test so a red gate is a red build. Lives in
# `tests/eval/` beside the phase 05 to 27 harnesses rather than in this crate's own `tests/`,
# because a gate is a claim about the product and not about a crate.
[[test]]
name = "curate_eval"
path = "../../tests/eval/curate_eval.rs"
