[package]
name         = "aura-render"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
publish.workspace      = true
description  = "The develop engine: a colour-managed, deterministic, non-destructive renderer that executes an edit recipe identically on every machine (phase 14)"

[dependencies]
aura-core    = { path = "../aura-core" }
aura-raw     = { path = "../aura-raw" }
aura-recipe  = { path = "../aura-recipe" }
blake3       = { workspace = true }
rayon        = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
toml         = { workspace = true }
time         = { workspace = true }
tracing      = { workspace = true }

# `aura-raw` is here, and it is the only crate in the workspace this one reaches into for
# maths rather than for a contract. The reason is invariant 8: `aura_raw::colour` already
# defines the working space, the camera matrices, the Bradford adaptation, the filmic
# shoulder and the dE2000 comparison, and a second copy of any of them would be a second
# renderer that drifts from the first while looking identical. Phase 02 owns colour; phase 14
# grades inside the space phase 02 defined.
#
# Deliberately absent: `wgpu`. See docs/adr/ADR-0029-render-pipeline.md section 4. The WGSL
# sources ship, are compiled into the binary and are gated by `tests/shader_parity.rs`; what
# does not ship is a backend nothing on this machine can execute or test.
#
# Also absent: `aura-catalog`. This crate stores nothing. `aura-recipe` owns migration 14 and
# this one owns the pixels, which is what keeps a render a pure function of its inputs.

[dev-dependencies]
tempfile     = { workspace = true }

# The section 10.1 gates, run as an ordinary test so a red gate is a red build. Lives in
# `tests/eval/` beside the phase 05 to 13 harnesses rather than in this crate's own `tests/`,
# because a gate is a claim about the product and not about a crate.
[[test]]
name = "render_eval"
path = "../../tests/eval/render_eval.rs"
