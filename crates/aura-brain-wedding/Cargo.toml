[package]
name         = "aura-brain-wedding"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "Scenes, rituals and the wedding's ordered story: the scene graph every later threshold is conditioned on"

[dependencies]
aura-core    = { path = "../aura-core" }
aura-catalog = { path = "../aura-catalog" }
aura-cloud   = { path = "../aura-cloud" }
aura-index   = { path = "../aura-index" }
aura-infer   = { path = "../aura-infer" }
# PHASE-10. The first pixels this crate has ever opened.
#
# Phases 07 and 08 sat entirely on stored numbers - the frozen phase 05 embedding, the
# descriptors, the timeline - and this crate's own header said so. Phase 10 cannot: an
# expression is on a face and an interaction is between two bodies, and neither is
# recoverable from a 512-wide vector that was trained to be scene-discriminative.
#
# The cost is honest and it is in `perf/budgets.toml`. What it buys back is that the
# crops are the ones `aura-vision` already warps for phases 06 and 09, so a wedding that
# has been scanned for faces pays for one decode and three heads rather than three
# decodes.
aura-preview = { path = "../aura-preview" }
aura-raw     = { path = "../aura-raw" }
aura-vision  = { path = "../aura-vision" }
rusqlite     = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
time         = { workspace = true }
toml         = { workspace = true }
tracing      = { workspace = true }
uuid         = { workspace = true }

[dev-dependencies]
tempfile     = { workspace = true }

# The section 10.1 gates, run as an ordinary test so a red gate is a red build.
# Lives in `tests/eval/` beside the phase 05 and 06 harnesses rather than in this
# crate's own `tests/`, because a gate is a claim about the product and not about
# a crate.
[[test]]
name = "scene_eval"
path = "../../tests/eval/scene_eval.rs"

# The section 10.1 gates for PHASE-08, in the same place and for the same reason.
[[test]]
name = "burst_eval"
path = "../../tests/eval/burst_eval.rs"

# The section 10.1 gates for PHASE-10, in the same place and for the same reason.
[[test]]
name = "emotion_eval"
path = "../../tests/eval/emotion_eval.rs"
