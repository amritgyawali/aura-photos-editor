# Muslim ritual taxonomy - PHASE-07 section 2.1.
#
# See `hindu.toml` for what every field means and for the one rule that
# matters: `id` is authored, unique across every file, and never reused.
#
# Reserved id range for this file: 100 - 129.
#
# ---------------------------------------------------------------------------
# TWO THINGS A PHOTOGRAPHER NEEDS FROM THIS FILE
# ---------------------------------------------------------------------------
#
# 1. **The nikah is a contract, not a procession.** The photographic moment is
#    two people, two witnesses, an officiant and a document on a table - often
#    in a small room, often brief, and frequently the only part of the day that
#    is legally the wedding. A pipeline that expects a Christian aisle finds
#    nothing here and labels the whole chapter `other`.
#
# 2. **Segregated celebrations are common and are two separate events.** Where
#    the men's and women's celebrations are held apart, they are two chapters
#    with two sets of frames, frequently by two shooters, and they interleave
#    in the timeline. That is the two-shooter regression fixture in section
#    10.1, arriving from a cultural direction rather than a staffing one.
#
# The product does not and will not infer anybody's religion. This file names
# rites from visible objects and staging, and nothing in phase 07 reads a
# tradition off a person - see `aura_cloud::tasks::SEGMENT_NAMING_SYSTEM`'s
# third rule, which is enforced structurally rather than by prompt.

