# Christian ritual taxonomy - PHASE-07 section 2.1.
#
# See `hindu.toml` for what every field means and for the one rule that
# matters: `id` is authored, unique across every file, and never reused.
#
# Reserved id range for this file: 70 - 99.
#
# One tradition file covering Catholic, Orthodox and Protestant practice,
# because the differences that matter photographically are which rites are
# PRESENT rather than what they look like: a nuptial mass has a communion and a
# civil-style church service does not, and both put the couple at an altar with
# an officiant facing a seated congregation. Where a rite is denominationally
# specific the `evidence` line says so.

version   = 1
tradition = "christian"
title     = "Christian"

[[ritual]]
id          = 70
slug        = "rehearsal"
title       = "Rehearsal"
aliases     = ["rehearsal dinner", "wedding rehearsal"]
phase       = "pre"
night       = true
evidence    = "the ceremony space in ordinary clothes; the party walking the aisle; an empty congregation"

