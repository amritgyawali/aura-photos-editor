title       = "Haldi"
aliases     = ["pithi", "gaye holud", "ubtan", "turmeric ceremony"]
cloud_label = "haldi"
phase       = "pre"
night       = false
evidence    = "turmeric paste applied by hand; yellow clothing; outdoors or in a courtyard; bowls and leaves"

