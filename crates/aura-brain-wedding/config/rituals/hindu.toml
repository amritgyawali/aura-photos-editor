# Hindu ritual taxonomy - PHASE-07 section 2.1.
#
# ===========================================================================
# HOW A TAXONOMY FILE WORKS
# ===========================================================================
#
# Rituals live in config rather than in a Rust enum because section 12's first
# failure mode is cultural blind spots, and a tradition that needs a rite this
# product has never heard of must be addable by editing a file rather than by
# shipping a build. `docs/adding-a-tradition.md` is the procedure.
#
# THE ONE RULE THAT MATTERS: `id` IS AUTHORED, NEVER DERIVED FROM FILE ORDER.
#
# Deriving an id from position would mean that inserting one rite renumbered
# every rite after it and silently relabelled every stored row in every
# catalog. So ids are written down, they are unique across ALL taxonomy files,
# and `Taxonomy::load` refuses a duplicate with `AURA-ML-5024`. Id ranges are
# reserved per tradition so two people editing two files cannot collide:
#
#   hindu      10 -  39
#   nepali     40 -  69
#   christian  70 -  99
#   muslim    100 - 129
#   civil     130 - 159
#   (next tradition starts at 160)
#
# Id 0 is reserved for `RitualId::NONE`.
#
# The catalog stores the SLUG, not the id. A catalog whose meaning depends on a
# config file that has since been edited is a catalog that lies.
#
# ---------------------------------------------------------------------------
# FIELDS
# ---------------------------------------------------------------------------
#
# id          authored, unique across every file, never reused
# slug        stored in `image_scenes.ritual`; snake_case, stable for ever
# title       what a photographer sees
# aliases     regional and transliterated spellings, used to match a cloud
#             answer and a photographer's search, never stored
# cloud_label the member of `aura_cloud::tasks::ALLOWED_RITUALS` this maps to,
#             or absent when phase 04's vocabulary has no word for it. See
#             ADR-0015 section 4: that vocabulary is frozen into three
#             cassettes and every cached answer, so it is mapped, not edited.
# phase       "pre" (before the wedding day), "day", or "post"
# evidence    visible objects and staging a classifier or a human can key on.
#             Documentation, not features - nothing reads this at run time -
#             and it is here because it is the knowledge a consultant has and a
#             file does not.
# night       true when the rite is typically after dark. Read by nothing in
#             phase 07; recorded because the `night` and `mixed_light`
#             attributes are what make a ceremony tolerance defensible, and the
#             tolerance argument in `scene_profiles.toml` cites it.

version   = 1
tradition = "hindu"
title     = "Hindu"

