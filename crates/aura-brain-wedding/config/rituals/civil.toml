# Civil and secular ritual taxonomy - PHASE-07 section 2.1.
#
# See `hindu.toml` for what every field means and for the one rule that
# matters: `id` is authored, unique across every file, and never reused.
#
# Reserved id range for this file: 130 - 159.
#
# ---------------------------------------------------------------------------
# WHY A CIVIL FILE IS NOT AN EMPTY FILE
# ---------------------------------------------------------------------------
#
# A civil ceremony is the case an unthinking taxonomy handles worst: it has no
# religious objects, so a ritual head trained on fire, garlands, chalices and
# contracts finds nothing and abstains on every frame. That is correct
# behaviour and a useless answer.
#
# What a civil ceremony DOES have is a signing, a reading, a declaration and
# frequently a borrowed rite - handfasting, a unity candle, a sand ceremony,
# a tea ceremony - chosen for meaning rather than for faith. This file names
# those, and it names the two structural moments a registry office always has,
# so that the ritual head has something to be confident about instead of
# abstaining its way through the only chapter that matters.
#
# Rites that appear here AND in a faith file are declared once, in the faith
# file, and referenced by the same slug: `handfasting` and `unity_candle` live
# in `christian.toml`, and a civil ceremony matches them through the loader's
# union across all files.

version   = 1
tradition = "civil"
title     = "Civil"

[[ritual]]
