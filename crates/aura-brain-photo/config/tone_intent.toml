# Tone and colour intents - PHASE-16 sections 6.1, 6.2 and 9.
#
# ===========================================================================
# THIS FILE IS A PRODUCT DECISION, NOT AN IMPLEMENTATION DETAIL
# ===========================================================================
#
# Section 9 gives PM the task "approve `tone_intent.toml` per scene with the
# consultant". This is that file, and it is the seventh in the product to
# require a written reason on every row.
#
# Phase 15's `exposure_targets.toml` decides how BRIGHT a photograph should be.
# This one decides what it should LOOK like, which is a softer question and a
# more dangerous one: there is no experiment that establishes how much contrast
# a Hindu ceremony wants. There is a convention, it differs between
# photographers, and section 12's fourth failure mode is "HSL fights the
# photographer's taste". Phase 17 is where a photographer's own answer replaces
# these; until then these are the product's opinion and they need a name
# against them.
#
# Two of the numbers below are the ones to read first, because they are the two
# that decide whether the product looks professional or looks filtered:
#
#   * `subject_contrast` is what the curve is FITTED to hit. It is a target for
#     the separation between the light and dark halves of the subject, not a
#     slider value, and it is the whole of "adaptive tone curve" in one number.
#   * `subtlety_cap` is the ceiling on the WHOLE grade. Section 12's first
#     failure mode is over-graded HDR-looking results, and this is the number
#     that makes "professional edits are subtle" enforceable rather than hoped
#     for.
#
# ---------------------------------------------------------------------------
# WHAT EACH FIELD MEANS
# ---------------------------------------------------------------------------
#
# contrast                                -100 .. 100
#     The scene's baseline contrast in the recipe's own units. The solver
#     starts here and moves toward what the histogram says the frame needs, so
#     this is an intent rather than a value: a frame that is already contrasty
#     ends up below it and a flat one above.
#
# subject_contrast                        0.05 .. 0.60
#     The target for the interquartile luminance spread of the SUBJECT region -
#     the faces when there are faces, the centre-weighted frame when there are
#     not - after the curve. This is what `curve::fit` solves for, and it is
#     measured on the subject rather than on the frame for phase 15's reason: a
#     dark reception hall with a well-lit bride is not a low-contrast
#     photograph.
#
# shadow_lift                             -100 .. 100
#     How far this scene wants its shadows opened, before the noise guard. The
#     guard reads phase 09's sigma estimate and can only REDUCE this, never
#     raise it: a scene cannot ask for a lift the sensor will not carry.
#
# highlight_recovery                      -100 .. 100
#     Negative pulls highlights down. A dress in sunlight and a window behind a
#     ceremony are the two cases that need it, and both are scenes rather than
#     frames, which is why the number is here.
#
# vibrance / saturation                   -100 .. 100
#     Vibrance weights away from already-saturated colours and saturation does
#     not. Every row prefers vibrance, and most rows leave saturation at zero:
#     flat saturation is what makes a sari look like a screenshot.
#
# clip_tolerance                          0.0 .. 0.20
#     How much of the frame this scene will accept becoming NEWLY clipped as a
#     result of the grade. The clipping guard re-solves anything above it, and
#     `CLIP_CEILING` is the floor no scene may exceed.
#
# greenery_hue_deg                        90 .. 160
#     Where this scene wants foliage to sit on the wheel. Outdoor foliage is
#     usually recorded too yellow-green, around 95-105 degrees; pulling it to
#     the target is the single most-noticed colour correction at an outdoor
#     wedding. Section 6.2 names it as the classic wedding problem.
#
# greenery_saturation                     0.0 .. 1.0
#     Where this scene wants foliage's saturation. Below what a camera records,
#     always: green is the colour a sensor most over-saturates and the colour a
#     viewer least wants saturated behind a person.
#
# sky_saturation                          0.0 .. 1.0
#     The same, for sky. Above what a camera records in most scenes, because a
#     slightly deeper sky is what a photographer does by hand.
#
# distractor_ceiling                      0.0 .. 1.0
#     How saturated a non-subject colour may be before the harmony solver tames
#     it. Section 2.1's fluorescent green exit sign. A LOW ceiling means this
#     scene tames aggressively; a high one means it leaves the room alone.
#
# max_band_shift                          0.0 .. 50.0
#     The largest adjustment any single HSL band may receive in this scene, in
#     recipe units. It is the second half of the subtlety defence and it is
#     per-band rather than total, because a solver that can move one band forty
#     units can recolour a dress.
#
# subtlety_cap                            0.05 .. 1.0
#     The ceiling on the root-mean-square of every normalised parameter this
#     phase sets. Above it the whole grade is scaled back and the frame carries
#     `subtlety_capped`. `SUBTLETY_CEILING` is the value no scene may exceed.
#
# rationale                               at least 9 characters
#     Why. A grading decision nobody can explain is one nobody can argue with.
#
# ---------------------------------------------------------------------------
# WHAT IS NOT IN THIS FILE, AND CANNOT BE ADDED
# ---------------------------------------------------------------------------
#
# There is no skin target. Not a hue, not a saturation, not a luminance, not a
# bucket. `ContentBand::Skin` is reported and never adjusted, and the guarantee
# in section 6.3 is measured against THIS FRAME'S OWN SKIN BEFORE THE GRADE
# rather than against anything written down here. A file with an ideal-skin row
# is how an editor lightens dark skin while believing it is following a
# convention, and the phase gate scans this file for one on every run.

version = 1

# ===========================================================================
# THE NEUTRAL ROW
# ===========================================================================
#
# What an unclassified frame, and any scene with no row of its own, is graded
# against. Deliberately timid in every direction: a small contrast intent, no
# saturation, a tight band cap and a low subtlety ceiling. A frame graded here
# also carries `no_intent_row` and loses confidence, so nobody mistakes a
# cautious grade for a scene-conditioned one.

[neutral]
contrast            = 8
subject_contrast    = 0.26
shadow_lift         = 8
highlight_recovery  = -10
vibrance            = 6
saturation          = 0
clip_tolerance      = 0.008
greenery_hue_deg    = 120
greenery_saturation = 0.42
sky_saturation      = 0.46
distractor_ceiling  = 0.80
max_band_shift      = 8
subtlety_cap        = 0.22
rationale = """
The substitute for a row nobody has written. Every number is the timid end of
its range, because the cost of under-grading a frame is that a photographer
adds contrast, and the cost of over-grading it is that they undo the whole
edit and stop trusting the rest of the gallery.
"""

