[package]
name = "aura-cli"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
publish.workspace      = true
description = "AURA headless driver: fixtures, import, verify and catalog inspection."

[[bin]]
name = "aura-cli"
path = "src/main.rs"

[dependencies]
aura-core    = { path = "../aura-core" }
aura-catalog = { path = "../aura-catalog" }
aura-ingest  = { path = "../aura-ingest" }
aura-jobs    = { path = "../aura-jobs" }
aura-perf    = { path = "../aura-perf" }
aura-raw     = { path = "../aura-raw" }
aura-cache   = { path = "../aura-cache" }
aura-preview = { path = "../aura-preview" }
aura-infer   = { path = "../aura-infer" }
aura-models  = { path = "../aura-models" }
aura-cloud   = { path = "../aura-cloud" }
aura-index   = { path = "../aura-index" }
aura-people  = { path = "../aura-people" }
aura-brain-wedding = { path = "../aura-brain-wedding" }
aura-brain-photo   = { path = "../aura-brain-photo" }
aura-vision  = { path = "../aura-vision" }
rusqlite.workspace   = true
serde.workspace      = true
serde_json.workspace = true
time.workspace       = true
tracing.workspace    = true
tracing-subscriber.workspace = true
uuid.workspace       = true
