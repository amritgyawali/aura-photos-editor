# Quality-control thresholds. PHASE-27 section 6.1.
#
# ---------------------------------------------------------------------------
# WHAT THIS FILE IS, AND THE ONE RULE THAT MAKES IT SAFE
# ---------------------------------------------------------------------------
#
# Section 6.1: "thresholds live in `qc_thresholds.toml` per scene class, because a dance floor
# tolerates more than a family formal." How fussy AURA is about somebody's wedding is a product
# decision, so this file is a product manager's to argue with.
#
# **Every number here may be lowered and none of it may be raised.** `crates/aura-qc/src/policy.rs`
# owns a ceiling for each one, the loader refuses a row that exceeds it, and the pass halts with
# `AURA-ML-5140` rather than falling back on defaults. Lowering a threshold makes AURA notice more;
# there is no edit to this file that makes it notice less than the build permits.
#
# The direction is the whole point. A QC agent whose thresholds a studio can widen is a QC agent a
# studio can switch off by editing a number, and `docs/how-qc-works.md` would then be a description
# of the defaults rather than a promise about the product. Phases 21, 22 and 24 all made their
# policy files work this way; this is the fourth.
#
# One consequence is worth stating because it caught this phase during construction: **a larger
# number is always more permissive.** Two thresholds were originally written as required minimums -
# the shadow headroom a frame must keep, and the sharpness a subject must reach - and both had to be
# reformulated as tolerances, because a table where some rows tighten upward and others downward is
# a table where a studio cannot tell which they did. `sharpness_slack` is how far below the
# code-owned reference floor a subject may sit; `shadow_deficit` is how much headroom may be given
# up.
#
# ---------------------------------------------------------------------------
# EVERY ROW NEEDS A REASON
# ---------------------------------------------------------------------------
#
# The loader refuses a scene row whose `reason` is empty. Fourth config file in the product to
# demand it, after phases 10, 12 and 25, and the argument is the same: a threshold nobody can
# explain is a threshold nobody can argue with, and this table is where the product decides whether
# a photographer's ceremony gets checked more carefully than their dance floor.
#
# ---------------------------------------------------------------------------
# THE COLUMNS
# ---------------------------------------------------------------------------
#
#   consistency_sigma      how many of its lighting group's own tolerances a frame may sit out
#   signature_distance     how far its grade character may sit from its anchors'
#   skin_de00              how far a person's skin may sit from their own gallery target
#   skin_hue_deg           how far the grade may have moved skin's hue
#   skin_chroma            how far it may have moved skin's chroma
#   exposure_ev            how far the finished frame may sit from its scene band
#   clipping_added         how much of the frame the edit may newly clip
#   shadow_deficit         how much shadow headroom may be given up
#   sharpness_slack        how far below the reference floor the subject may sit
#   ringing                how much halo sharpening may have left
#   texture_loss           how much texture denoising may have taken
#   identity_drift         how far a recovered face may have moved from the person
#   texture_floor_miss     how far below its floor the retouched texture band may sit
#   naturalness_excursion  how far a micro-retouch may have moved a catchlight, hairline or teeth
#   allowance_overspend    how much of the per-image local allowance may be overspent
#   mask_overreach         how far an operation may exceed what its region supports
#   cleanup_artefact       how visible a generative removal may be
#   duplicate_hamming      how close two delivered frames may be, in difference-hash distance
#   crop_shortfall         how far a crop may fall below its purpose's resolution floor
#
# ---------------------------------------------------------------------------
# THE LOOP
# ---------------------------------------------------------------------------
#
# Not per scene, and deliberately: a remedy either realised its predicted gain or it did not, which
# is arithmetic rather than an aesthetic judgement. A dance floor does not want a different
# definition of "this correction worked".
#
# These five run in mixed directions, so the loader checks each one by hand rather than by table:
# raising `min_gain_share` and `replace_confidence` is stricter, lowering `max_collateral` and
# `max_rounds` is stricter, and raising `replace_margin` is stricter.

version = 1

[loop]
# Half of a predicted gain. Below the contract's floor and remedies that did nothing get kept.
min_gain_share = 0.50
# A remedy may worsen another check by a tenth of that check's own threshold and no more.
max_collateral = 0.10
# The one bound in this phase whose mistake a photographer cannot see: a swapped frame is a
# photograph they never chose, and a gallery gives them no way to notice the one that is missing.
replace_confidence = 0.85
# A runner-up must be better by a third of the threshold. A frame that is two per cent sharper is
# the same photograph twice, and swapping on that margin makes the gallery a function of noise.
replace_margin = 0.35
max_rounds = 2
max_tickets_per_image = 8


[[scene]]
id = "ceremony"
reason = """\
  The one part of the day nobody can reshoot. Colour and skin are held tightest here because a \
  ceremony is a long sequence a client scrolls in order, so a drift that would be invisible on \
  one frame is a visible warm-then-cool across forty. Detail is held less tightly than colour: \
  ceremonies are often the darkest lit part of the day and a sharpness threshold that ignored \
  that would file a ticket on every frame."""
consistency_sigma = 1.1
signature_distance = 0.165
skin_de00 = 1.65
skin_hue_deg = 3.3
skin_chroma = 0.055
exposure_ev = 0.6
clipping_added = 0.03
shadow_deficit = 0.21
sharpness_slack = 0.3375
ringing = 0.09
texture_loss = 0.225
identity_drift = 0.06
texture_floor_miss = 0.09
naturalness_excursion = 0.15
allowance_overspend = 0.12
mask_overreach = 0.15
cleanup_artefact = 0.1
duplicate_hamming = 4
crop_shortfall = 0.15

