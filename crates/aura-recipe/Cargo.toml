[package]
name         = "aura-recipe"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
publish.workspace      = true
description  = "The edit recipe: the versioned, canonical, non-destructive document every AI editing decision writes into, and the interchange that carries it to Lightroom and back (phase 14)"

[dependencies]
aura-core    = { path = "../aura-core" }
aura-catalog = { path = "../aura-catalog" }
blake3       = { workspace = true }
rusqlite     = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
time         = { workspace = true }
tracing      = { workspace = true }

# Deliberately absent: `aura-render`.
#
# The recipe does not know how to execute itself, and the crate that executes it depends on
# this one rather than the other way round. That direction is what lets phases 15 to 17
# write parameters without linking a renderer, what lets `aura-cli` diff two recipes without
# opening an image, and what keeps `docs/recipe-schema-v1.md` a document about a document.
#
# Also absent: every crate that decides a parameter value. Phases 15 to 26 depend on this
# one; it depends on none of them, exactly as `aura-explain` depends on no deciding crate.
#
# `aura-catalog` is here because this crate owns migration 14's four tables. `blake3` is
# here for one thing: the recipe hash of ADR-0029 section 5.

[dev-dependencies]
tempfile     = { workspace = true }
