# The error-code registry. One entry per code used anywhere in the product.
# CI fails if a code appears in Rust source but not here, or if an entry lacks a
# runbook file. Runbook paths are relative to the workspace root.

[[error]]
code         = "AURA-IO-1001"
severity     = "run_blocking"
recovery     = "ask_user"
summary      = "Source folder does not exist"
user_message = "That folder is not there any more. Reconnect the drive or choose the folder again."
runbook      = "docs/runbooks/AURA-IO-1001.md"
introduced   = "PHASE-01"

[[error]]
code         = "AURA-IO-1002"
severity     = "run_blocking"
recovery     = "ask_user"
summary      = "Permission denied reading the source folder"
user_message = "AURA is not allowed to read that folder. Grant access in system settings, then try again."
runbook      = "docs/runbooks/AURA-IO-1002.md"
introduced   = "PHASE-01"

[[error]]
code         = "AURA-IO-1003"
severity     = "run_blocking"
recovery     = "retry"
summary      = "Volume disconnected during a run"
user_message = "The drive was disconnected. Plug it back in and AURA will carry on from where it stopped."
runbook      = "docs/runbooks/AURA-IO-1003.md"
introduced   = "PHASE-01"

[[error]]
code         = "AURA-IO-1004"
severity     = "run_blocking"
recovery     = "halt"
summary      = "Disk full"
user_message = "The disk is full. Free up space and AURA will resume; nothing done so far is lost."
runbook      = "docs/runbooks/AURA-IO-1004.md"
introduced   = "PHASE-01"

[[error]]
code         = "AURA-IO-1005"
severity     = "item_failed"
recovery     = "quarantine"
summary      = "Path exceeds the operating system limit"
user_message = "One file is nested too deeply for Windows to open. It has been set aside; the rest imported normally."
runbook      = "docs/runbooks/AURA-IO-1005.md"
introduced   = "PHASE-01"

[[error]]
