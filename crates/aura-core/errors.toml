recovery     = "ask_user"
summary      = "Catalog location is inside a cloud-synced folder"
user_message = "Catalogs cannot live in a synced folder such as Dropbox, iCloud Drive, OneDrive or Google Drive, because syncing corrupts them. Choose a folder on this computer."
runbook      = "docs/runbooks/AURA-IO-1008.md"
introduced   = "PHASE-01"

[[error]]
code         = "AURA-IO-1009"
