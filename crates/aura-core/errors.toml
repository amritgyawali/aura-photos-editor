[[error]]
code         = "AURA-DB-3008"
severity     = "run_blocking"
recovery     = "retry"
summary      = "Catalog busy for longer than the write timeout"
user_message = "The catalog is busy. AURA will try again in a moment."
runbook      = "docs/runbooks/AURA-DB-3008.md"
introduced   = "PHASE-01"

[[error]]
code         = "AURA-JOB-7001"
