introduced   = "PHASE-15"

# Phase 19. Local light sculpting, ML 5066-5071. The same five shapes the phase
# 09, 11 and 15 blocks have - version drift, a refused edit, one item that could
# not be done, a refused config file, and a config file missing a row - plus one
# that is new in this phase and is the phase's own honesty: a mask this phase
# does not own was unusable, so an operation was scaled down or given up rather
# than run against a guess.

