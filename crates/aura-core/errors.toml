# ---------------------------------------------------------------------------
# PHASE-24. Generative cleanup: distraction removal, bounded by a safety engine.
# ---------------------------------------------------------------------------
#
# Eight codes, ML 5115-5122. Five are the shapes phases 09, 11, 15, 19 to 23 use -
# version drift, a refused edit, one item that could not be done, a refused config
# file and a config file missing a row - and three are this phase's own.
#
# The three are all refusals, and that is the phase rather than an accident. AURA-ML-5121
# is the self-check undoing a removal before anybody saw it. AURA-ML-5122 is the product
# saying it could not show a removal was safe, which is different from saying it found a
# person - one is a claim and the other is the absence of one. And AURA-ML-5116 is a
# proposal that broke a guarantee, which cannot be constructed and therefore cannot be
# stored, so the code exists to say that the attempt happened.
#
# Removing a distraction is the first thing this product does that takes away something
# the camera got right, so every code here resolves toward leaving the photograph alone.

[[error]]
