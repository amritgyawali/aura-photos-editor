recovery     = "retry"
summary      = "File changed while being read"
user_message = "A file was still being written while AURA read it. It will be retried."
runbook      = "docs/runbooks/AURA-IO-1007.md"
introduced   = "PHASE-01"

[[error]]
code         = "AURA-IO-1008"
